/* ---------------- Practice / session ---------------- */

function getLearningQueue(ids){
  var now = Date.now();
  var byId = {};
  state.mcqs.forEach(function(m){ byId[m.id]=m; });
  var due = ids.map(function(id){ return byId[id]; }).filter(Boolean).filter(function(q){
    return q.learning && (q.learning.due||0) <= now && !state.sleepingSubjects[q.subject];
  });
  due.sort(function(a,b){
    var order={misconception:0,noconcept:1,learning:2,mastered:3,new:4};
    return (order[getLearningState(a)]??9)-(order[getLearningState(b)]??9);
  });
  return due.map(function(q){return q.id;});
}


/* ================= FSRS-inspired scheduler ================= */
var DAY = 24*60*60*1000;
var FSRS_W = [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61];

function fsrsClamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function fsrsInitStability(rating){ return Math.max(0.1, FSRS_W[rating-1]); }
function fsrsInitDifficulty(rating){
  return fsrsClamp(FSRS_W[4] - Math.exp(FSRS_W[5]*(rating-1)) + 1, 1, 10);
}
function fsrsNextDifficulty(difficulty, rating){
  var deltaD = -FSRS_W[6]*(rating-3);
  var dPrime = difficulty + deltaD*(10-difficulty)/9;
  var anchor = fsrsInitDifficulty(4);
  return fsrsClamp(FSRS_W[7]*anchor + (1-FSRS_W[7])*dPrime, 1, 10);
}
function fsrsRetrievability(elapsedDays, stability){
  if (!stability || stability <= 0) return 0;
  return Math.pow(0.9, elapsedDays / stability);
}
function fsrsNextStability(difficulty, stability, r, rating){
  if (rating === 1) {
    return Math.max(0.1,
      FSRS_W[11] * Math.pow(difficulty, -FSRS_W[12]) *
      (Math.pow(stability + 1, FSRS_W[13]) - 1) *
      Math.exp((1 - r) * FSRS_W[14])
    );
  }
  var hardPenalty = rating === 2 ? FSRS_W[15] : 1;
  var easyBonus = rating === 4 ? FSRS_W[16] : 1;
  return Math.max(0.1, stability * (
    1 + Math.exp(FSRS_W[8]) * (11 - difficulty) * Math.pow(stability, -FSRS_W[9]) *
    (Math.exp((1 - r) * FSRS_W[10]) - 1) * hardPenalty * easyBonus
  ));
}
/* fsrsState: {stability, difficulty, reps, lapses, lastReview} | null (first review) */
function fsrsStep(fsrsState, rating, now){
  var out;
  if (!fsrsState || !fsrsState.reps) {
    out = { stability: fsrsInitStability(rating), difficulty: fsrsInitDifficulty(rating), reps: 1, lapses: rating===1?1:0 };
  } else {
    var elapsedDays = fsrsState.lastReview ? (now - fsrsState.lastReview) / DAY : 0;
    var r = fsrsRetrievability(elapsedDays, fsrsState.stability);
    out = {
      stability: fsrsNextStability(fsrsState.difficulty, fsrsState.stability, r, rating),
      difficulty: fsrsNextDifficulty(fsrsState.difficulty, rating),
      reps: fsrsState.reps + 1,
      lapses: fsrsState.lapses + (rating===1?1:0)
    };
  }
  out.lastReview = now;
  return out;
}
function fsrsIntervalDays(stability){ return Math.max(1/144, stability); } /* requestRetention=0.9 -> interval == stability (days), floor 10min */
/* ============================================================ */

/* ================= Learning Engine (Phase 3) ================= */
const LearningEngine={

  MAX_HISTORY:8,

  record(mcq,picked,correct){

    if(!mcq.learning){
      mcq.learning={
        due:Date.now(),
        interval:0,
        history:[],
        lastReviewed:null,
        fsrs:null
      };
    }
    if(mcq.learning.fsrs===undefined) mcq.learning.fsrs=null;

    mcq.learning.history.push({
      correct,
      picked,
      rating:null,
      expected:mcq.answer[0],
      ts:Date.now()
    });

    if(mcq.learning.history.length>this.MAX_HISTORY){
      mcq.learning.history.splice(
        0,
        mcq.learning.history.length-this.MAX_HISTORY
      );
    }

    /* Auto-derive an Again/Hard/Good/Easy-equivalent (1-4) rating from the question's
       own tracked history, instead of asking the user to self-report one after every
       question. classify() below reflects history INCLUDING the attempt just pushed. */
    const rating = this.deriveRating(mcq, correct);
    mcq.learning.history[mcq.learning.history.length-1].rating = rating;

    this.schedule(mcq, rating);

  },

  deriveRating(mcq, correct){
    if(!correct) return 1; // Again — wrong this round, always, no exceptions

    const cls = this.classify(mcq);
    if(cls === 'misconception' || cls === 'noconcept') return 2; // Hard — right this time, but the pattern says you're not solid
    if(cls === 'mastered') return 4; // Easy
    return 3; // Good — new / learning
  },

  classify(mcq){

    const h=mcq.learning.history;

    if(h.length<3){
      return "new";
    }

    const correct=h.filter(x=>x.correct).length;
    const wrong=h.filter(x=>!x.correct);

    const correctRate=correct/h.length;

    let wrongConsistency=0;

    if(wrong.length>=2){

      const freq={};

      wrong.forEach(x=>{
        freq[x.picked]=(freq[x.picked]||0)+1;
      });

      wrongConsistency=Math.max(...Object.values(freq))/wrong.length;

    }

    const last2=h.slice(-2).every(x=>x.correct);

    if(
      wrong.length>=2 &&
      wrongConsistency>=0.6
    ){
      return "misconception";
    }

    if(
      correctRate>=0.7 &&
      last2
    ){
      return "mastered";
    }

    if(correct>0){
      return "learning";
    }

    return "noconcept";

  },

  schedule(mcq, rating){

    const clsState=this.classify(mcq);

    const now=Date.now();

    mcq.learning.state=clsState;

    /* Real FSRS stability/difficulty step drives the base interval. */
    mcq.learning.fsrs = fsrsStep(mcq.learning.fsrs, rating, now);
    var intervalDays = fsrsIntervalDays(mcq.learning.fsrs.stability);

    /* Pedagogical ceilings: cards flagged as a recurring misconception, showing
       no grasp of the concept, or still brand-new get pulled back sooner than
       raw FSRS math alone would schedule them, regardless of this review's rating. */
    if (clsState === 'misconception') intervalDays = Math.min(intervalDays, 0.5);       /* ≤ 12h */
    else if (clsState === 'noconcept') intervalDays = Math.min(intervalDays, 30/1440);  /* ≤ 30m */
    else if (clsState === 'new') intervalDays = Math.min(intervalDays, 10/1440);        /* ≤ 10m */

    mcq.learning.interval = intervalDays * DAY;
    mcq.learning.lastReviewed = now;
    mcq.learning.due = now + mcq.learning.interval;

  }

};
/* ============================================================ */

function getLearningState(mcq){
  return LearningEngine.classify(mcq);
}

function getMostRepeatedWrong(mcq){
  const wrong={};
  mcq.learning.history
    .filter(x=>!x.correct)
    .forEach(x=>{
      wrong[x.picked]=(wrong[x.picked]||0)+1;
    });
  let max=0;
  let option="-";
  Object.entries(wrong).forEach(([k,v])=>{
    if(v>max){
      max=v;
      option=k;
    }
  });
  return option;
}

function renderExplanation(mcq){
  return mcq.explanation ? '<div class="reveal-explain">' + renderContent(mcq.explanation) + '</div>' : '';
}

function renderReveal(mcq){
  const state=LearningEngine.classify(mcq);
  let banner="";
  switch(state){
    case "new":
      banner='';
      break;
    case "noconcept":
      banner='<div class="learning-banner noconcept">No Concept<br>Your incorrect answers don\'t follow a pattern.<br>Focus on understanding the concept instead of memorizing.</div>';
      break;
    case "misconception":
      var trap=getMostRepeatedWrong(mcq);
      banner='<div class="learning-banner misconception">Recurring Misconception<br>You\'ve repeatedly selected <strong>' + escapeHtml(trap) + '</strong><br>Review why this option is incorrect.</div>';
      break;
    case "learning":
      banner='<div class="learning-banner learning">Recovering<br>You\'re beginning to answer this correctly.</div>';
      break;
    case "mastered":
      banner='<div class="learning-banner mastered">Mastered<br>Excellent consistency.<br>This question will appear less often.</div>';
      break;
  }
  return banner + renderExplanation(mcq);
}

function startPractice(ids){
  var byId = {}; state.mcqs.forEach(function(m){ byId[m.id] = m; });
  if(state.learningMode && state.learningMode.enabled){
    ids = getLearningQueue(ids);
  }
  var pool = ids.map(function(id){ return byId[id]; }).filter(Boolean);
  if(!pool.length){
    if(state.learningMode && state.learningMode.enabled){
      alert("✓ You're caught up!\n\nNothing is scheduled for review yet.\n\nDisable FSRS Mode to practice all questions.");
    } else {
      showToast('No questions to practice with those filters.');
    }
    return;
  }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  state.session = {
    ids: pool.map(function(m){ return m.id; }),
    index: 0,
    selected: null,
    revealed: false,
    results: [],
    undoStack: [],
    stats: { correct:0, wrong:0, misconception:0, learning:0, mastered:0, noconcept:0 }
  };
  state.view = 'practice';
  render();
}

function renderPractice(){
  var s = state.session;
  var m = state.mcqs.find(function(x){ return x.id === s.ids[s.index]; });
  if (!m) { state.view = 'summary'; return renderSummary(); }
  var pct = Math.round((s.index / s.ids.length) * 100);

  var html = '<div class="practice-wrap">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
    '<button class="btn btn-ghost btn-sm" data-action="leave-practice">' + icon('chevron-left',14) + ' Back</button>' +
    (s.undoStack && s.undoStack.length ? '<button class="undo-btn icon-inline" data-action="undo-answer">' + icon('undo',13) + ' Undo last answer</button>' : '') +
    '</div>' +
    bookmarkButton(m) +
    '</div>';
  var nextM = state.mcqs.find(function(x){ return x.id === s.ids[s.index+1]; });
  var nextLabel = nextM && nextM.learning ? LearningEngine.classify(nextM) : (nextM ? 'new' : null);
  html += '<div class="practice-progress"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
    '<div class="progress-label">' + (s.index+1) + ' / ' + s.ids.length +
    (nextLabel ? '<br>Next: ' + escapeHtml(nextLabel) : '') + '</div></div>';

  html += '<div class="card answer-sheet">';
  html += '<div class="qmeta"><span class="qnum mono">Q.' + (s.index+1) + '</span><div class="qmeta-tags">' +
    '<span class="source-pill" style="background:' + colorForSource(m.source) + '">' + escapeHtml(m.source) + '</span>' +
    m.tags.map(function(t){ return '<span class="tag-pill">' + escapeHtml(t) + '</span>'; }).join('') +
    '</div></div>';

  if (m.passage) html += '<div class="passage-box">' + renderContent(m.passage) + '</div>';
  html += '<div class="qtext">' + renderContent(m.question) + '</div>';

  if (m.isShortAnswer) {
    html += '<div class="short-answer-box"><textarea id="shortAnswerInput" placeholder="Type your answer, then reveal to check yourself" ' + (s.revealed ? 'disabled' : '') + '>' + (s.selected||'') + '</textarea></div>';
    if (!s.revealed) {
      html += '<div class="answer-footer" style="justify-content:flex-end;"><button class="btn btn-primary" data-action="reveal-short">Reveal answer</button></div>';
    }
  } else {
    html += '<div class="bubbles">';
    m.options.forEach(function(opt){
      var isSelected = s.selected && s.selected.indexOf(opt.letter) !== -1;
      var isCorrectLetter = m.answer.indexOf(opt.letter) !== -1;
      var cls = 'bubble';
      if (isSelected) cls += ' selected';
      if (s.revealed) {
        cls += ' locked';
        if (isCorrectLetter) cls += ' reveal-correct';
        else if (isSelected) cls += ' reveal-wrong';
      }
      html += '<button class="' + cls + '" ' + (s.revealed ? 'disabled' : '') + ' data-action="select-option" data-letter="' + opt.letter + '">' +
        '<span class="bubble-mark"><svg class="bubble-ring" viewBox="0 0 30 30"><ellipse cx="15" cy="15" rx="12" ry="12" pathLength="100"></ellipse></svg>' +
        '<span class="bubble-letter">' + opt.letter + '</span></span>' +
        '<span class="bubble-text">' + escapeHtml(opt.text) + '</span></button>';
    });
    html += '</div>';
    if (!s.revealed) {
      html += '<div class="answer-footer" style="justify-content:flex-end;">' +
        '<button class="btn btn-primary" data-action="reveal-mcq"' + (s.selected && s.selected.length ? '' : ' disabled') + '>Check answer</button></div>';
    }
  }

  if (s.revealed) {
    var isCorrect = evaluateCorrect(m, s.selected);
    html += '<div class="reveal-panel">';
    html += '<div class="reveal-verdict ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? 'Correct' : (m.answer[0]==='UNKNOWN' ? 'No answer key on record' : 'Not quite')) + '</div>';
    if (!m.isShortAnswer && m.answer[0] !== 'UNKNOWN') {
      html += '<div class="view-sub" style="margin-bottom:8px;">Correct answer: ' + m.answer.join(', ') + '</div>';
    }
    if (m.isShortAnswer) {
      html += '<div class="view-sub" style="margin-bottom:8px;">Answer on record: ' + escapeHtml(m.answer[0]) + '</div>';
    }
    html += renderReveal(m);
    html += '<div class="answer-footer" style="justify-content:flex-end;">' +
      '<button class="btn btn-primary" data-action="next-question">' + (s.index + 1 < s.ids.length ? 'Next question' : 'Finish session') + '</button></div>';
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

function evaluateCorrect(m, selected){
  if (!selected) return false;
  if (m.isShortAnswer) return true;
  if (m.answer.indexOf('UNKNOWN') !== -1) return null;
  var a = selected.slice().sort().join(',');
  var b = m.answer.slice().sort().join(',');
  return a === b;
}

function revealCurrent(){
  var s = state.session;
  s.revealed = true;
  render();
}

async function advanceAfterReveal(){
  var s = state.session;
  var m = state.mcqs.find(function(x){ return x.id === s.ids[s.index]; });
  if (!m) return;
  var correct = evaluateCorrect(m, s.selected);
  var pickedStr = m.isShortAnswer ? (s.selected || '') : (s.selected ? s.selected.join(',') : '');

  if (!s.undoStack) s.undoStack = [];
  s.undoStack.push({
    mcqId: m.id,
    learningBefore: JSON.parse(JSON.stringify(m.learning)),
    statsBefore: JSON.parse(JSON.stringify(s.stats)),
    resultsLenBefore: s.results.length,
    index: s.index,
    selected: s.selected
  });

  LearningEngine.record(m, pickedStr, correct); /* rating is auto-derived inside, from this question's own history */

  var cls = LearningEngine.classify(m);
  if (s.stats && s.stats[cls] !== undefined) s.stats[cls]++;
  if (correct === true) s.stats.correct++;
  if (correct === false) s.stats.wrong++;

  s.results.push({ id: m.id, correct: correct });
  bumpStreak();
  await saveLibrary();

  s.index++; s.selected = null; s.revealed = false;
  if (s.index >= s.ids.length) state.view = 'summary';
  render();
}

async function undoLastAnswer(){
  var s = state.session;
  if (!s || !s.undoStack || !s.undoStack.length) return;
  var last = s.undoStack.pop();
  var mm = state.mcqs.find(function(x){ return x.id === last.mcqId; });
  if (mm) mm.learning = last.learningBefore;
  s.results.length = last.resultsLenBefore;
  s.stats = last.statsBefore;
  s.index = last.index;
  s.selected = last.selected;
  s.revealed = true;
  await saveLibrary();
  render();
}

function renderSummary(){
  var s = state.session;
  var total = s.results.length;
  var correct = s.results.filter(function(r){ return r.correct === true; }).length;
  var scored = s.results.filter(function(r){ return r.correct !== null; }).length;
  var pct = scored ? Math.round((correct / scored) * 100) : 0;
  var byId = {}; state.mcqs.forEach(function(m){ byId[m.id] = m; });

  var classCounts = { mastered:0, learning:0, misconception:0, noconcept:0 };
  s.results.forEach(function(r){
    var m = byId[r.id];
    if (!m || !m.learning) return;
    var cls = LearningEngine.classify(m);
    if (classCounts[cls] !== undefined) classCounts[cls]++;
  });

  var html = '<div class="practice-wrap"><div class="card summary-card">';
  html += '<div class="score-ring' + (pct >= 60 ? ' good' : '') + '"><div class="score-big serif">' + pct + '%</div><div class="score-sub">' + correct + ' / ' + scored + ' scored</div></div>';
  html += '<div class="serif" style="font-size:19px;">Session complete</div>';
  html += '<div class="view-sub">' + total + ' question' + (total===1?'':'s') + ' attempted this round.</div>';

  html += '<div class="summary-breakdown">';
  html += '<div class="summary-row"><span>Questions</span><span>' + total + '</span></div>';
  html += '<div class="summary-row"><span>Accuracy</span><span>' + pct + '%</span></div>';
  html += '<div class="summary-row"><span>Mastered</span><span>' + classCounts.mastered + '</span></div>';
  html += '<div class="summary-row"><span>Learning</span><span>' + classCounts.learning + '</span></div>';
  html += '<div class="summary-row"><span>Misconceptions</span><span>' + classCounts.misconception + '</span></div>';
  html += '<div class="summary-row"><span>No Concept</span><span>' + classCounts.noconcept + '</span></div>';
  html += '</div>';

  var wrongIds = s.results.filter(function(r){ return r.correct === false; }).map(function(r){ return r.id; });
  html += '<div class="action-row" style="justify-content:center;margin-top:22px;">';
  if (wrongIds.length) html += '<button class="btn btn-primary" data-action="retry-wrong" data-ids="' + wrongIds.join(',') + '">Retry the ' + wrongIds.length + ' missed</button>';
  html += '<button class="btn btn-ghost" data-action="back-to-library">Back to library</button>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

/* ---------------- Events ---------------- */
function bindEvents(){
  var statusSel = document.querySelector('[data-action="set-status-filter"]');
  if (statusSel) statusSel.addEventListener('change', function(e){ state.filters.status = e.target.value; render(); });
  var searchInput = document.getElementById('globalSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function(e){
      state.filters.search = e.target.value;
      var cursorPos = e.target.selectionStart;
      render();
      var newInput = document.getElementById('globalSearchInput');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    });
  }
}

async function onClick(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'toggle-sidebar') { state.sidebarOpen = !state.sidebarOpen; render(); return; }
  if (action === 'set-view') { if (guardNavigation(action, el)) return; state.view = el.getAttribute('data-view'); state.sidebarOpen = false; render(); return; }
  if (action === 'open-dashboard') { if (guardNavigation(action, el)) return; state.view = 'dashboard'; state.sidebarOpen = false; render(); return; }
  if (action === 'toggle-fsrs-mode') {
    state.learningMode.enabled = !state.learningMode.enabled;
    saveFsrsMode();
    showToast('FSRS Mode ' + (state.learningMode.enabled ? 'enabled' : 'disabled'));
    render();
    return;
  }
  if (action === 'toggle-fsrs-card') {
    state.fsrsCardExpanded = !state.fsrsCardExpanded;
    saveFsrsCardExpanded();
    render();
    return;
  }
  if (action === 'toggle-subject-sleep') {
    var subj = el.getAttribute('data-subject');
    if (state.sleepingSubjects[subj]) {
      delete state.sleepingSubjects[subj];
      showToast('"' + subj + '" is awake again — back in FSRS review.');
    } else {
      state.sleepingSubjects[subj] = true;
      showToast('"' + subj + '" is now asleep — paused from FSRS review and Start Practice on the root page.');
    }
    saveSleepingSubjects();
    render();
    return;
  }
  if (action === 'toggle-dark-mode') {
    state.darkMode = !state.darkMode;
    saveDarkMode();
    render();
    return;
  }
  if (action === 'export-library') { exportLibrary(); return; }
  if (action === 'import-library') {
    var fi = document.getElementById('importFileInput');
    if (fi) fi.click();
    return;
  }
  if (action === 'open-settings') { openSettingsModal(); return; }
  if (action === 'sign-out') { signOutUser(); return; }
  if (action === 'google-sign-in') { signInWithGoogle(); return; }
  if (action === 'start-queue-preview') { state.view = 'queuepreview'; state.sidebarOpen = false; render(); return; }
  if (action === 'start-due-session') {
    var dueIds = getLearningQueue(state.mcqs.map(function(m){return m.id;}));
    requestStartPractice(dueIds, true);
    return;
  }
  if (action === 'start-study-ahead') {
    var tomorrow = Date.now() + 86400000;
    var byId = {}; state.mcqs.forEach(function(m){ byId[m.id]=m; });
    var ids = state.mcqs.filter(function(q){ return (q.learning.due||0) <= tomorrow; }).map(function(q){ return q.id; });
    requestStartPractice(ids, true);
    return;
  }
  if (action === 'start-practice-all') {
    var allIds = state.mcqs.map(function(m){ return m.id; });
    requestStartPractice(allIds, false);
    return;
  }

  if (action === 'toggle-node') {
    var key = el.getAttribute('data-path');
    state.expanded[key] = !state.expanded[key];
    render(); return;
  }
  if (action === 'select-node') {
    if (guardNavigation(action, el)) return;
    var key2 = el.getAttribute('data-path');
    state.selectedPath = key2.split('␟');
    state.view = 'browse';
    state.expanded[key2] = true;
    state.forceList = false;
    state.sidebarOpen = false;
    render(); return;
  }
  if (action === 'view-node-questions') {
    var key4 = el.getAttribute('data-path');
    state.selectedPath = key4.split('␟');
    state.view = 'browse';
    state.expanded[key4] = true;
    state.forceList = true;
    state.sidebarOpen = false;
    render(); return;
  }
  if (action === 'clear-selection') { state.selectedPath = null; state.forceList = false; render(); return; }

  if (action === 'toggle-source-filter') {
    var s = el.getAttribute('data-source');
    state.filters.sources[s] = !state.filters.sources[s];
    render(); return;
  }
  if (action === 'toggle-tag-filter') {
    var tg = el.getAttribute('data-tag');
    state.filters.tags[tg] = !state.filters.tags[tg];
    render(); return;
  }
  if (action === 'toggle-tag-panel') {
    state.filters.tagPanelOpen = !state.filters.tagPanelOpen;
    render(); return;
  }
  if (action === 'clear-all-filters') {
    state.filters.sources = {};
    state.filters.tags = {};
    state.filters.status = 'all';
    render(); return;
  }
  if (action === 'clear-search') {
    state.filters.search = '';
    render();
    var si = document.getElementById('globalSearchInput');
    if (si) si.focus();
    return;
  }

  if (action === 'start-practice') {
    var tree = buildTree();
    var node = state.selectedPath ? getNodeByPath(tree, state.selectedPath) : null;
    var ids = node ? collectIds(node) : state.mcqs.map(function(m){ return m.id; });
    var byId = {}; state.mcqs.forEach(function(m){ byId[m.id]=m; });
    if (!node) ids = ids.filter(function(id){ return byId[id] && !state.sleepingSubjects[byId[id].subject]; }); /* root-level "Start Practice" skips sleeping subjects entirely */
    var filtered = ids.filter(function(id){ return byId[id] && passesFilters(byId[id]); });
    requestStartPractice(filtered, state.learningMode.enabled);
    return;
  }

  if (action === 'preview-mcq') {
    var id = el.getAttribute('data-id');
    requestStartPractice([id], false);
    return;
  }

  if (action === 'copy-prompt') {
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(MASTER_PROMPT);
        copied = true;
      }
    } catch(err) { copied = false; }
    if (!copied) {
      /* Fallback for contexts where the async Clipboard API is blocked (e.g. sandboxed
         preview iframes without clipboard-write permission delegated) — the older
         execCommand path works in more of those environments. */
      try {
        var ta = document.createElement('textarea');
        ta.value = MASTER_PROMPT;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch(err2) { copied = false; }
    }
    if (copied) {
      showToast('Prompt copied — paste it into your LLM of choice.');
    } else {
      var pb = document.getElementById('promptBox');
      if (pb && window.getSelection) {
        var range = document.createRange();
        range.selectNodeContents(pb);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      showToast('Could not copy automatically — the prompt text below is now selected, press Ctrl/Cmd+C to copy.');
    }
    return;
  }

  if (action === 'clear-ingest') {
    document.getElementById('ingestArea').value = '';
    document.getElementById('parseReport').innerHTML = '';
    return;
  }

  if (action === 'parse-preview') {
    var raw = document.getElementById('ingestArea').value;
    var override = document.getElementById('sourceOverrideInput').value.trim();
    if (!raw.trim()) { showToast('Paste some standardized MCQ text first.'); return; }
    var result = parseLibraryText(raw, override || null);
    var reportEl = document.getElementById('parseReport');
    if (!result.mcqs.length) {
      reportEl.innerHTML = '<div class="parse-report" style="color:var(--pen-red);">No valid #Q blocks found. Check the format against the prompt above.</div>';
      return;
    }
    var bySubj = {};
    result.mcqs.forEach(function(m){ bySubj[m.subject] = (bySubj[m.subject]||0) + 1; });
    var subjSummary = Object.keys(bySubj).map(function(k){ return k + ' (' + bySubj[k] + ')'; }).join(', ');
    var reportHtml = '<div class="parse-report"><span class="parse-ok">' + result.mcqs.length + ' questions parsed</span> — ' + escapeHtml(subjSummary) + '</div>';
    if (result.errors.length) {
      reportHtml += '<div class="parse-err-list">' + result.errors.length + ' block(s) skipped:<br>' +
        result.errors.slice(0,15).map(function(er){ return '· ' + escapeHtml(er.message); }).join('<br>') + '</div>';
    }
    reportHtml += '<div class="action-row"><button class="btn btn-primary" data-action="confirm-import">Import ' + result.mcqs.length + ' questions</button></div>';
    reportEl.innerHTML = reportHtml;
    reportEl._pending = result.mcqs;
    return;
  }

  if (action === 'confirm-import') {
    var reportEl2 = document.getElementById('parseReport');
    var pending = reportEl2 && reportEl2._pending;
    if (!pending || !pending.length) return;
    pending.forEach(function(m){
      if (!state.sources[m.source]) state.sources[m.source] = { color: colorForSource(m.source) };
    });
    state.mcqs = state.mcqs.concat(pending);
    await saveLibrary();
    await saveSources();
    document.getElementById('ingestArea').value = '';
    showToast(pending.length + ' questions logged to your library.');
    state.view = 'browse';
    render();
    return;
  }

  if (action === 'delete-source') {
    var srcName = el.getAttribute('data-source');
    if (!confirm('Delete "' + srcName + '" and all its MCQs? This cannot be undone.')) return;
    state.mcqs = state.mcqs.filter(function(m){ return m.source !== srcName; });
    delete state.sources[srcName];
    await saveLibrary();
    await saveSources();
    showToast('Source deleted.');
    render();
    return;
  }

  if (action === 'clear-all') {
    if (!confirm('Delete your entire Practex library? This cannot be undone.')) return;
    state.mcqs = [];
    state.sources = {};
    state.selectedPath = null;
    await saveLibrary();
    await saveSources();
    showToast('Library cleared.');
    render();
    return;
  }

  if (action === 'close-modal') { state.pendingNav = null; closeModal(); return; }
  if (action === 'modal-backdrop-close') { if (e.target === el) { state.pendingNav = null; closeModal(); } return; }
  if (action === 'view-history') { openHistoryModal(el.getAttribute('data-id')); return; }
  if (action === 'edit-mcq') { openEditModal(el.getAttribute('data-id')); return; }
  if (action === 'save-edit-mcq') { saveEditMcq(el.getAttribute('data-id')); return; }

  if (action === 'open-deck-menu') { openDeckMenu(el.getAttribute('data-path')); return; }

  if (action === 'deck-rename') { openRenameDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-rename-deck') {
    var rPath = el.getAttribute('data-path');
    var rInput = document.getElementById('renameDeckInput');
    var rNewName = rInput ? rInput.value : '';
    if (renameDeck(rPath.split('␟'), rNewName)) {
      await saveLibrary(); await saveSleepingSubjects();
      closeModal(); render(); showToast('Renamed to "' + rNewName.trim() + '".');
    } else {
      showToast('Enter a name first.');
    }
    return;
  }

  if (action === 'deck-move') { openMoveDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-move-deck') {
    var mvPath = el.getAttribute('data-path');
    var mvArr = mvPath.split('␟');
    var mvSelect = document.getElementById('moveDeckSelect');
    var mvNewInput = document.getElementById('moveDeckNewInput');
    var mvDest = (mvNewInput && mvNewInput.value.trim()) ? mvNewInput.value.trim() : (mvSelect ? mvSelect.value : '');
    if (!mvDest) { showToast('Pick or type a destination subject first.'); return; }
    var movedName = mvArr[mvArr.length-1];
    if (mvDest === '__LIBRARY_ROOT__') {
      moveDeckUnder(mvArr, []);
      await saveLibrary();
      closeModal(); render(); showToast('"' + movedName + '" is now a top-level subject in the Library.');
      return;
    }
    if (isPathWithinOrEqual([mvDest], mvArr)) { showToast('Can\'t move a deck into itself.'); return; }
    moveDeckUnder(mvArr, [mvDest]);
    await saveLibrary();
    closeModal(); render(); showToast('Moved "' + movedName + '" under "' + mvDest + '".');
    return;
  }

  if (action === 'deck-copy') {
    var cpPath = el.getAttribute('data-path');
    var cpCount = duplicateDeck(cpPath.split('␟'));
    await saveLibrary();
    closeModal(); render();
    showToast('Copied — ' + cpCount + ' question' + (cpCount===1?'':'s') + ' duplicated as "' + cpPath.split('␟').pop() + ' (copy)".');
    return;
  }

  if (action === 'deck-cut') {
    var cutPath = el.getAttribute('data-path');
    var cutArr = cutPath.split('␟');
    state.clipboardNode = { path: cutArr, name: cutArr[cutArr.length-1] };
    closeModal(); render();
    showToast('"' + state.clipboardNode.name + '" cut — navigate to a destination and choose "Paste here".');
    return;
  }
  if (action === 'cancel-cut') { state.clipboardNode = null; render(); return; }
  if (action === 'paste-node-here') {
    if (!state.clipboardNode) { render(); return; }
    var destPath = el.getAttribute('data-path');
    var destPathArr = destPath ? destPath.split('␟') : [];
    if (!destPathArr.length) {
      if (state.clipboardNode.path.length === 1) {
        showToast('That\'s already at the Library root.');
        state.clipboardNode = null; render();
        return;
      }
      var promotedName = state.clipboardNode.name;
      moveDeckUnder(state.clipboardNode.path, []);
      await saveLibrary();
      state.clipboardNode = null;
      render();
      showToast('"' + promotedName + '" moved to the Library root as a top-level subject.');
      return;
    }
    if (isPathWithinOrEqual(destPathArr, state.clipboardNode.path)) {
      showToast(destPathArr.join(' / ') === state.clipboardNode.path.join(' / ') ? 'That\'s already where it is.' : 'Can\'t paste a deck into itself.');
      if (destPathArr.join(' / ') === state.clipboardNode.path.join(' / ')) state.clipboardNode = null;
      render();
      return;
    }
    moveDeckUnder(state.clipboardNode.path, destPathArr);
    await saveLibrary();
    var pastedName = state.clipboardNode.name;
    state.clipboardNode = null;
    render();
    showToast('"' + pastedName + '" moved here.');
    return;
  }

  if (action === 'deck-delete') { openDeleteDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-delete-deck') {
    var delPath = state.pendingDeckDelete;
    state.pendingDeckDelete = null;
    if (delPath) {
      var delArr = delPath.split('␟');
      var removedIds = deleteDeck(delArr);
      if (state.selectedPath && state.selectedPath.join('␟').indexOf(delPath) === 0) {
        state.selectedPath = null; state.forceList = false;
      }
      await deleteMcqRows(removedIds);
      closeModal(); render();
      showToast('Deleted ' + removedIds.length + ' question' + (removedIds.length===1?'':'s') + '.');
    } else {
      closeModal();
    }
    return;
  }
  if (action === 'leave-practice') { requestLeavePractice(); return; }
  if (action === 'pause-and-leave') {
    state.pausedSession=currentSessionSnapshot(); await savePausedSession(); state.session=null; applyPendingNav(); closeModal(); render(); return;
  }
  if (action === 'leave-without-pausing') {
    state.session=null; applyPendingNav(); closeModal(); render(); return;
  }
  if (action === 'resume-paused') {
    if(!state.pausedSession){ closeModal(); return; }
    state.session=JSON.parse(JSON.stringify(state.pausedSession)); state.pausedSession=null; await savePausedSession(); state.view='practice'; closeModal(); render(); return;
  }
  if (action === 'confirm-new-test') {
    var pending=state.pendingStart; state.pendingStart=null; closeModal();
    if(pending){ state.learningMode.enabled=pending.learningEnabled; startPractice(pending.ids); }
    return;
  }
  if (action === 'jump-subject') {
    state.selectedPath=[el.getAttribute('data-subject')]; state.view='browse'; state.forceList=false; state.expanded[state.selectedPath.join('␟')]=true; render(); return;
  }

  if (action === 'select-option') {
    if (state.session.revealed) return;
    var letter = el.getAttribute('data-letter');
    state.session.selected = [letter];
    render();
    return;
  }

  if (action === 'reveal-mcq') { revealCurrent(); return; }

  if (action === 'reveal-short') {
    var val = document.getElementById('shortAnswerInput').value.trim();
    state.session.selected = val;
    revealCurrent();
    return;
  }

  if (action === 'next-question') { advanceAfterReveal(); return; }

  if (action === 'undo-answer') { undoLastAnswer(); return; }

  if (action === 'bookmark-current') {
    var s2 = state.session;
    var m2 = state.mcqs.find(function(x){ return x.id === s2.ids[s2.index]; });
    m2.flagged = !m2.flagged;
    await saveLibrary();
    render();
    return;
  }

  if (action === 'retry-wrong') {
    var ids2 = el.getAttribute('data-ids').split(',').filter(Boolean);
    startPractice(ids2);
    return;
  }

  if (action === 'back-to-library') {
    state.session = null;
    state.view = 'browse';
    render();
    return;
  }
}

/* ---------------- Auth ---------------- */
function userDisplayInfo(user){
  if (!user) return { name: '', email: '', initials: '?', avatarUrl: null };
  var meta = user.user_metadata || {};
  var name = meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Account');
  var initials = name.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){ return w[0].toUpperCase(); }).join('') || '?';
  return { name: name, email: user.email || '', initials: initials, avatarUrl: meta.avatar_url || meta.picture || null };
}
async function signInWithGoogle(){
  if (!supabaseClient) return;
  var errEl = document.getElementById('authError');
  if (errEl) errEl.textContent = '';
  try {
    var res = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if (res.error) throw res.error;
    /* Browser navigates to Google's consent screen and back — nothing else to do here. */
  } catch(e) {
    console.error('signInWithGoogle:', e);
    if (errEl) errEl.textContent = 'Could not start Google sign-in: ' + (e.message || e);
  }
}
async function signOutUser(){
  if (!supabaseClient) return;
  try {
    await supabaseClient.auth.signOut();
  } catch(e) {
    console.error('signOutUser:', e);
  }
  state.currentUser = null;
  state.mcqs = []; state.sources = {}; state.selectedPath = null; state.session = null;
  closeModal();
  showAuthGate();
}

}
function showAuthGate(){

  document.getElementById('loadingScreen').style.display = 'none';

async function showApp(){

  document.getElementById('loadingScreen').style.display = 'flex';

  document.getElementById('appRoot').style.display = 'none';

/* ---------------- Init ---------------- */
async function init(){
  document.body.addEventListener('click', onClick); /* bound once — delegates for both #appRoot, #authGate, and #modalRoot */
  var importInput = document.getElementById('importFileInput');
  if (importInput) {
    importInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (file) importLibraryFromFile(file);
      e.target.value = '';
    });
  }

  if (!supabaseClient) {
    document.getElementById('loadingScreen').style.display = 'none';
    showAuthGate();
    return;
  }

  supabaseClient.auth.onAuthStateChange(function(event, session){
    if (event === 'SIGNED_IN' && session && session.user) {
      state.currentUser = session.user;
      showApp();
    } else if (event === 'SIGNED_OUT') {
      state.currentUser = null;
      showAuthGate();
    }
  });

  var authInitialized = false;
  supabaseClient.auth.onAuthStateChange(function(event, session){
    /* onAuthStateChange is the ONLY source of truth for whether we're signed in —
       it fires once on subscribe with whatever the client currently knows (waiting
       for any OAuth-redirect token in the URL to finish parsing first), and again on
       every subsequent sign-in/out/refresh. Deliberately not also calling
       getSession() separately here: racing the two was exactly what caused a signed-in
       redirect to sometimes land back on the sign-in screen with the raw token still
       sitting unprocessed in the URL, if getSession() resolved a beat before the
       library finished parsing the redirect. */
    if (session && session.user) {
      if (authInitialized && state.currentUser && state.currentUser.id === session.user.id) return; /* e.g. TOKEN_REFRESHED for the same user — already loaded, don't reload */
      authInitialized = true;
      state.currentUser = session.user;
      showApp();
    } else {
      authInitialized = true;
      state.currentUser = null;
      showAuthGate();
    }
  });
}
init();


document.addEventListener('keydown', function(e){
  if(state.view!=='practice' || !state.session) return;
  var active=document.activeElement;
  var typing=active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT'||active.isContentEditable);
  if(typing) return;
  var s=state.session, m=state.mcqs.find(function(x){return x.id===s.ids[s.index];});
  if(!m) return;

  /* Number keys 1-9 select the corresponding option (pre-reveal only) */
  if(/^[1-9]$/.test(e.key) && !s.revealed && !m.isShortAnswer){
    var idx=parseInt(e.key,10)-1;
    if(m.options[idx]){ e.preventDefault(); s.selected=[m.options[idx].letter]; render(); }
    return;
  }

  /* Letter keys (A, B, C, D...) select the option with that letter */
  if(/^[a-zA-Z]$/.test(e.key) && !s.revealed && !m.isShortAnswer){
    var letter=e.key.toUpperCase();
    var match=m.options.filter(function(o){ return o.letter===letter; })[0];
    if(match){ e.preventDefault(); s.selected=[letter]; render(); return; }
  }

  /* F toggles bookmark */
  if(e.key==='f'||e.key==='F'){
    e.preventDefault(); m.flagged=!m.flagged; saveLibrary(); render(); return;
  }

  /* Space: before reveal, acts as Check Answer (only if something is selected);
     after reveal, advances to the next question — same as clicking "Next question". */
  if(e.code==='Space'){
    e.preventDefault();
    if(!s.revealed){
      var hasSelection = m.isShortAnswer
        ? !!(document.getElementById('shortAnswerInput') && document.getElementById('shortAnswerInput').value.trim())
        : !!(s.selected && s.selected.length);
      if(!hasSelection) return;
      if(m.isShortAnswer){
        s.selected = document.getElementById('shortAnswerInput').value.trim();
      }
      revealCurrent();
    } else {
      advanceAfterReveal();
    }
    return;
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Backspace') return;

  var el = document.activeElement;
  var typing = el && (
    el.tagName === 'INPUT' ||
    el.tagName === 'TEXTAREA' ||
    el.tagName === 'SELECT' ||
    el.isContentEditable
  );

  if (typing) return;

  e.preventDefault();

  if (state.view === 'practice' && state.session) { requestLeavePractice(); return; }
  if (state.view !== 'browse') { state.view = 'browse'; state.forceList = false; render(); return; }

  if (!state.selectedPath) return;

  if (state.selectedPath.length === 1) {
    state.selectedPath = null;
    state.forceList = false;
  } else {
    state.selectedPath = state.selectedPath.slice(0, -1);
    state.forceList = false;
  }

  render();
});

})();
</script>
</body>
</html>
