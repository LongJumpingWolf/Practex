/* ---------------- Practice / session ---------------- */

function getLearningQueue(ids){
  var now = Date.now();
  var byId = {};
  state.mcqs.forEach(function(m){ byId[m.id]=m; });
  var due = ids.map(function(id){ return byId[id]; }).filter(Boolean).filter(function(q){
    return q.learning && (q.learning.due||0) <= now && !state.sleepingSubjects[q.subject] && !q.asleep;
  });
  due.sort(function(a,b){
    var order={misconception:0,noconcept:1,learning:2,mastered:3,new:4};
    return (order[getLearningState(a)]??9)-(order[getLearningState(b)]??9);
  });
  return due.map(function(q){return q.id;});
}


/* ================= FSRS-inspired scheduler ================= */
var DAY = 24*60*60*1000;
var FSRS_W = [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61];

function fsrsClamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function fsrsInitStability(rating){ return Math.max(0.1, FSRS_W[rating-1]); }
function fsrsInitDifficulty(rating){
  return fsrsClamp(FSRS_W[4] - Math.exp(FSRS_W[5]*(rating-1)) + 1, 1, 10);
}
function fsrsNextDifficulty(difficulty, rating){
  var deltaD = -FSRS_W[6]*(rating-3);
  var dPrime = difficulty + deltaD*(10-difficulty)/9;
  var anchor = fsrsInitDifficulty(4);
  return fsrsClamp(FSRS_W[7]*anchor + (1-FSRS_W[7])*dPrime, 1, 10);
}
function fsrsRetrievability(elapsedDays, stability){
  if (!stability || stability <= 0) return 0;
  return Math.pow(0.9, elapsedDays / stability);
}
function fsrsNextStability(difficulty, stability, r, rating){
  if (rating === 1) {
    return Math.max(0.1,
      FSRS_W[11] * Math.pow(difficulty, -FSRS_W[12]) *
      (Math.pow(stability + 1, FSRS_W[13]) - 1) *
      Math.exp((1 - r) * FSRS_W[14])
    );
  }
  var hardPenalty = rating === 2 ? FSRS_W[15] : 1;
  var easyBonus = rating === 4 ? FSRS_W[16] : 1;
  return Math.max(0.1, stability * (
    1 + Math.exp(FSRS_W[8]) * (11 - difficulty) * Math.pow(stability, -FSRS_W[9]) *
    (Math.exp((1 - r) * FSRS_W[10]) - 1) * hardPenalty * easyBonus
  ));
}
/* fsrsState: {stability, difficulty, reps, lapses, lastReview} | null (first review) */
function fsrsStep(fsrsState, rating, now){
  var out;
  if (!fsrsState || !fsrsState.reps) {
    out = { stability: fsrsInitStability(rating), difficulty: fsrsInitDifficulty(rating), reps: 1, lapses: rating===1?1:0 };
  } else {
    var elapsedDays = fsrsState.lastReview ? (now - fsrsState.lastReview) / DAY : 0;
    var r = fsrsRetrievability(elapsedDays, fsrsState.stability);
    out = {
      stability: fsrsNextStability(fsrsState.difficulty, fsrsState.stability, r, rating),
      difficulty: fsrsNextDifficulty(fsrsState.difficulty, rating),
      reps: fsrsState.reps + 1,
      lapses: fsrsState.lapses + (rating===1?1:0)
    };
  }
  out.lastReview = now;
  return out;
}
function fsrsIntervalDays(stability){ return Math.max(1/144, stability); } /* requestRetention=0.9 -> interval == stability (days), floor 10min */
/* ============================================================ */

/* ================= Learning Engine (Phase 3) ================= */
const LearningEngine={

  MAX_HISTORY:8,
  SLOW_ANSWER_MS: 45000,       // deliberated more than 45s before checking — treated as hesitant, not confident
  SLOW_EXPLANATION_MS: 20000,  // spent more than 20s on the explanation — treated as "actually studying it", not skimming

  /* timeToAnswerMs/timeOnExplanationMs are optional — pass null if unavailable (e.g.
     undo doesn't have a clean re-measurement) rather than guessing. */
  record(mcq,picked,correct,timeToAnswerMs,timeOnExplanationMs){

    if(!mcq.learning){
      mcq.learning={
        due:Date.now(),
        interval:0,
        history:[],
        lastReviewed:null,
        fsrs:null
      };
    }
    if(mcq.learning.fsrs===undefined) mcq.learning.fsrs=null;

    var remarks = this.deriveRemarks(correct, timeToAnswerMs, timeOnExplanationMs);

    mcq.learning.history.push({
      correct,
      picked,
      rating:null,
      expected:mcq.answer[0],
      ts:Date.now(),
      timeToAnswerMs: (typeof timeToAnswerMs === 'number') ? timeToAnswerMs : null,
      timeOnExplanationMs: (typeof timeOnExplanationMs === 'number') ? timeOnExplanationMs : null,
      remarks: remarks
    });

    if(mcq.learning.history.length>this.MAX_HISTORY){
      mcq.learning.history.splice(
        0,
        mcq.learning.history.length-this.MAX_HISTORY
      );
    }

    /* Auto-derive an Again/Hard/Good/Easy-equivalent (1-4) rating from the question's
       own tracked history, instead of asking the user to self-report one after every
       question. classify() below reflects history INCLUDING the attempt just pushed. */
    const rating = this.deriveRating(mcq, correct, timeToAnswerMs);
    mcq.learning.history[mcq.learning.history.length-1].rating = rating;

    this.schedule(mcq, rating);
    this.checkAutoSleep(mcq);

  },

  /* Lightweight, background-only qualitative tags per attempt — not shown during
     practice itself, just recorded for later review (the question's History modal)
     and to inform deriveRating below. Purely heuristic flat thresholds, not adjusted
     per question length — a reasonable starting point, not a precise model. */
  deriveRemarks(correct, timeToAnswerMs, timeOnExplanationMs){
    var remarks = [];
    var slow = typeof timeToAnswerMs === 'number' && timeToAnswerMs > this.SLOW_ANSWER_MS;
    var fast = typeof timeToAnswerMs === 'number' && timeToAnswerMs < 5000;
    if (correct && slow) remarks.push('Hesitant — took a while but got there');
    else if (correct && fast) remarks.push('Confident — quick and correct');
    else if (correct === false && fast) remarks.push('Rushed — answered quickly but missed it');
    else if (correct === false && slow) remarks.push('Struggled — spent time and still missed it');
    if (typeof timeOnExplanationMs === 'number' && timeOnExplanationMs > this.SLOW_EXPLANATION_MS) {
      remarks.push('Reviewed the explanation closely');
    }
    return remarks;
  },

  deriveRating(mcq, correct, timeToAnswerMs){
    if(!correct) return 1; // Again — wrong this round, always, no exceptions

    const cls = this.classify(mcq);
    var rating;
    if(cls === 'misconception' || cls === 'noconcept') rating = 2; // Hard — right this time, but the pattern says you're not solid
    else if(cls === 'mastered') rating = 4; // Easy
    else rating = 3; // Good — new / learning

    /* A correct answer that took unusually long is a weaker fluency signal than the
       classification alone suggests — nudge the rating down a notch (never below
       Hard, since it was still right) so FSRS doesn't push the interval out as
       aggressively as it would for a fast, confident correct answer. This is the
       "extra edge" — response time feeding the scheduler, not just right/wrong. */
    if (typeof timeToAnswerMs === 'number' && timeToAnswerMs > this.SLOW_ANSWER_MS && rating > 2) {
      rating -= 1;
    }
    return rating;
  },

  /* Puts a question to sleep on its own (independent of subject-level sleep) once
     it's been answered correctly N times in a row — same due-date pause and
     Start-Practice exclusion subject-sleep gets, just scoped to one question instead
     of a whole deck. Purely additive to a streak of correct answers; a single wrong
     answer resets the streak naturally since history stops being all-correct. */
  checkAutoSleep(mcq){
    if (!state.autoSleepEnabled || mcq.asleep) return;
    var streakNeeded = state.autoSleepStreak || 4;
    var h = mcq.learning.history;
    if (h.length < streakNeeded) return;
    var recent = h.slice(-streakNeeded);
    if (recent.every(function(x){ return x.correct === true; })) {
      mcq.asleep = true;
      mcq.autoSlept = true; // one-shot flag — the caller shows a toast and clears it
    }
  },

  classify(mcq){

    const h=mcq.learning.history;

    if(h.length<3){
      return "new";
    }

    const correct=h.filter(x=>x.correct).length;
    const wrong=h.filter(x=>!x.correct);

    const correctRate=correct/h.length;

    let wrongConsistency=0;

    if(wrong.length>=2){

      const freq={};

      wrong.forEach(x=>{
        freq[x.picked]=(freq[x.picked]||0)+1;
      });

      wrongConsistency=Math.max(...Object.values(freq))/wrong.length;

    }

    const last2=h.slice(-2).every(x=>x.correct);

    if(
      wrong.length>=2 &&
      wrongConsistency>=0.6
    ){
      return "misconception";
    }

    if(
      correctRate>=0.7 &&
      last2
    ){
      return "mastered";
    }

    if(correct>0){
      return "learning";
    }

    return "noconcept";

  },

  schedule(mcq, rating){

    const clsState=this.classify(mcq);

    const now=Date.now();

    mcq.learning.state=clsState;

    /* Real FSRS stability/difficulty step drives the base interval. */
    mcq.learning.fsrs = fsrsStep(mcq.learning.fsrs, rating, now);
    var intervalDays = fsrsIntervalDays(mcq.learning.fsrs.stability);

    /* Pedagogical ceilings: cards flagged as a recurring misconception or showing no
       grasp of the concept get pulled back sooner than raw FSRS math alone would
       schedule them, regardless of this review's rating — that part is deliberate,
       it's the "focus more on the wrong ones" behavior.
       "new" (fewer than 3 attempts so far) is different: it should ONLY be crammed
       back quickly if you actually struggled (rating 1-2). A confidently correct
       first answer (rating 3-4) has no evidence it needs to be seen again in 10
       minutes — capping it there anyway was overriding the real FSRS-computed
       interval (often several days) on literally every question's first two
       attempts, which is why a full day's questions kept coming right back the
       next day regardless of how well they went. */
    if (clsState === 'misconception') intervalDays = Math.min(intervalDays, 0.5);       /* ≤ 12h */
    else if (clsState === 'noconcept') intervalDays = Math.min(intervalDays, 30/1440);  /* ≤ 30m */
    else if (clsState === 'new' && rating <= 2) intervalDays = Math.min(intervalDays, 10/1440); /* ≤ 10m — only when you actually struggled */

    /* This is exam-prep MCQ practice, not an open-ended flashcard deck meant to be
       remembered forever — even a thoroughly "mastered" question should resurface at
       least monthly rather than drift out for a whole season the way pure FSRS math
       alone would eventually push a high-stability card. */
    var MAX_PRACTICE_INTERVAL_DAYS = 30;
    intervalDays = Math.min(intervalDays, MAX_PRACTICE_INTERVAL_DAYS);

    mcq.learning.interval = intervalDays * DAY;
    mcq.learning.lastReviewed = now;
    mcq.learning.due = now + mcq.learning.interval;

  },

  /* Re-derives a question's due date from data ALREADY stored on it (its existing
     FSRS stability, its own classification, and the rating its last attempt actually
     got) without touching or re-simulating any history. This exists because the
     ceiling logic above was buggy for a while — it force-capped "new" questions to a
     10-minute interval regardless of how confidently correct they were, throwing away
     a perfectly correct FSRS-computed stability every time. That stability was never
     wrong, only the ceiling applied on top of it was — so a question answered before
     the fix doesn't need to be re-answered or re-graded, just re-scheduled using the
     current (fixed) ceiling rules against the number that was already right. Anchored
     to the last actual review time, not "now" — this reconstructs what the due date
     should have been computed as back then, not a fresh interval starting today.
     Safe to run on every question, repeatedly — a question already scheduled under
     the current rules just recomputes to the same due date, no-op. */
  recomputeDue(mcq){
    if (!mcq.learning || !mcq.learning.fsrs || !mcq.learning.history || !mcq.learning.history.length) return false;
    const clsState = this.classify(mcq);
    const lastEntry = mcq.learning.history[mcq.learning.history.length - 1];
    const rating = lastEntry.rating || 3;
    const anchor = mcq.learning.lastReviewed || mcq.learning.fsrs.lastReview || Date.now();

    var intervalDays = fsrsIntervalDays(mcq.learning.fsrs.stability);
    if (clsState === 'misconception') intervalDays = Math.min(intervalDays, 0.5);
    else if (clsState === 'noconcept') intervalDays = Math.min(intervalDays, 30/1440);
    else if (clsState === 'new' && rating <= 2) intervalDays = Math.min(intervalDays, 10/1440);
    intervalDays = Math.min(intervalDays, 30);

    const newInterval = intervalDays * DAY;
    const newDue = anchor + newInterval;
    const changed = Math.round(newDue) !== Math.round(mcq.learning.due || 0);
    mcq.learning.state = clsState;
    mcq.learning.interval = newInterval;
    mcq.learning.due = newDue;
    return changed;
  }

};
/* ============================================================ */

function getLearningState(mcq){
  return LearningEngine.classify(mcq);
}

function getMostRepeatedWrong(mcq){
  const wrong={};
  mcq.learning.history
    .filter(x=>!x.correct)
    .forEach(x=>{
      wrong[x.picked]=(wrong[x.picked]||0)+1;
    });
  let max=0;
  let option="-";
  Object.entries(wrong).forEach(([k,v])=>{
    if(v>max){
      max=v;
      option=k;
    }
  });
  return option;
}

function renderExplanation(mcq){
  var imgs = mcq.answerImages || [];
  var imagesHtml = imgs.length ? '<div class="qimage-grid">' + imgs.map(function(hash){
    return '<div class="qimage-thumb"><img data-hash-src="' + escapeHtml(hash) + '" data-action="view-mcq-image" data-hash="' + escapeHtml(hash) + '" alt=""></div>';
  }).join('') + '</div>' : '';
  return imagesHtml + (mcq.explanation ? '<div class="reveal-explain">' + renderContent(mcq.explanation) + '</div>' : '');
}

function renderReveal(mcq){
  const state=LearningEngine.classify(mcq);
  const hist=mcq.learning.history||[];
  const justAnsweredCorrectly=hist.length && hist[hist.length-1].correct===true;
  let banner="";
  switch(state){
    case "new":
      banner='';
      break;
    case "noconcept":
      banner='<div class="learning-banner noconcept">No Concept<br>Your incorrect answers don\'t follow a pattern.<br>Focus on understanding the concept instead of memorizing.</div>';
      break;
    case "misconception":
      var trap=getMostRepeatedWrong(mcq);
      if(justAnsweredCorrectly){
        /* classify() looks at the whole recent pattern, not just this attempt — so it's
           entirely possible to land on "misconception" right after answering correctly
           (e.g. 2 of your last 3 attempts leaned on the same wrong option, but this one
           landed). The underlying signal is still worth keeping — it's still scheduled
           to come back sooner than a clean pass would warrant — but saying "you've
           repeatedly selected X" in the same breath as "Correct" reads as a flat
           contradiction, so the wording needs to actually reflect what just happened. */
        banner='<div class="learning-banner misconception">Good, But Keep An Eye On This<br>Right this time — but you\'ve often picked <strong>' + escapeHtml(trap) + '</strong> before, so it\'s scheduled to come back sooner than usual.</div>';
      } else {
        banner='<div class="learning-banner misconception">Recurring Misconception<br>You\'ve repeatedly selected <strong>' + escapeHtml(trap) + '</strong><br>Review why this option is incorrect.</div>';
      }
      break;
    case "learning":
      banner='<div class="learning-banner learning">Recovering<br>You\'re beginning to answer this correctly.</div>';
      break;
    case "mastered":
      banner='<div class="learning-banner mastered">Mastered<br>Excellent consistency.<br>This question will appear less often.</div>';
      break;
  }
  return banner + renderExplanation(mcq);
}

function startPractice(ids){
  var byId = {}; state.mcqs.forEach(function(m){ byId[m.id] = m; });
  if(state.learningMode && state.learningMode.enabled){
    ids = getLearningQueue(ids);
  }
  var pool = ids.map(function(id){ return byId[id]; }).filter(Boolean);
  if(!pool.length){
    if(state.learningMode && state.learningMode.enabled){
      alert("✓ You're caught up!\n\nNothing is scheduled for review yet.\n\nDisable FSRS Mode to practice all questions.");
    } else {
      showToast('No questions to practice with those filters.');
    }
    return;
  }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  state.session = {
    ids: pool.map(function(m){ return m.id; }),
    index: 0,
    viewIndex: 0, /* which question is currently displayed — usually equals index (the frontier), but can sit behind it while reviewing an already-answered question */
    selected: null,
    revealed: false,
    shortAnswerCorrect: null,
    results: [],
    undoStack: [],
    stats: { correct:0, wrong:0, misconception:0, learning:0, mastered:0, noconcept:0 },
    questionShownAt: Date.now(), /* silent timing — when the current question first became interactive */
    revealedAt: null,            /* silent timing — when it was revealed, so time-on-explanation can be measured */
    lastTimeToAnswerMs: null
  };
  state.view = 'practice';
  render();
}

/* Birds-eye view of the whole session — jump to any already-reached question, see at
   a glance what's correct/wrong/unattempted, and which ones are bookmarked. */
function openQuestionOverview(){
  var s = state.session;
  if (!s) return;
  var html = '<h3>Question overview</h3>';
  html += '<div class="q-ov-legend">' +
    '<span class="q-ov-legend-item"><span class="q-ov-dot correct"></span>Correct</span>' +
    '<span class="q-ov-legend-item"><span class="q-ov-dot wrong"></span>Wrong</span>' +
    '<span class="q-ov-legend-item"><span class="q-ov-dot upcoming"></span>Not attempted</span>' +
    '<span class="q-ov-legend-item">' + icon('bookmark',11) + ' Bookmarked</span>' +
    '</div>';
  html += '<div class="q-ov-grid">';
  s.ids.forEach(function(id, i){
    var mcq = state.mcqs.find(function(x){ return x.id === id; });
    var result = s.results[i];
    var statusCls = 'upcoming';
    if (result) statusCls = result.correct ? 'correct' : (result.correct === false ? 'wrong' : 'unknown');
    var reachable = i <= s.index;
    var isCurrent = i === s.viewIndex;
    html += '<button class="q-ov-cell ' + statusCls + (isCurrent ? ' current' : '') + (!reachable ? ' locked' : '') + '"' +
      (reachable ? ' data-action="jump-to-question" data-index="' + i + '"' : ' disabled title="Not reached yet"') + '>' +
      (i+1) +
      (mcq && mcq.flagged ? '<span class="q-ov-bookmark">' + icon('bookmark',9) + '</span>' : '') +
      '</button>';
  });
  html += '</div>';
  html += '<div class="action-row" style="margin-top:14px;margin-bottom:0;"><button class="btn btn-ghost" data-action="close-modal">Close</button></div>';
  showRichModal(html, 'narrow');
}

function renderPractice(){
  var s = state.session;
  var isReviewing = s.viewIndex < s.index;
  var m = state.mcqs.find(function(x){ return x.id === s.ids[s.viewIndex]; });
  if (!m) { state.view = 'summary'; return renderSummary(); }
  var result = isReviewing ? s.results[s.viewIndex] : null;
  var viewSelected = isReviewing ? (result ? result.selected : null) : s.selected;
  var viewRevealed = isReviewing ? true : s.revealed;
  var pct = Math.round((s.index / s.ids.length) * 100);

  var html = '<div class="practice-wrap">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;">' +
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
    '<button class="btn btn-ghost btn-sm" data-action="leave-practice">' + icon('chevron-left',14) + ' Back</button>' +
    '<button class="btn btn-ghost btn-sm" data-action="practice-prev"' + (s.viewIndex > 0 ? '' : ' disabled') + ' title="Previous question">' + icon('chevron-left',14) + '</button>' +
    '<button class="btn btn-ghost btn-sm" data-action="practice-next"' + (s.viewIndex < s.index ? '' : ' disabled') + ' title="Next question">' + icon('chevron-right',14) + '</button>' +
    '<button class="btn btn-ghost btn-sm" data-action="open-question-overview" title="Question overview">' + icon('layout-grid',14) + ' Overview</button>' +
    (!isReviewing && s.undoStack && s.undoStack.length ? '<button class="undo-btn icon-inline" data-action="undo-answer">' + icon('undo',13) + ' Undo last answer</button>' : '') +
    '</div>' +
    bookmarkButton(m) +
    '</div>';

  if (isReviewing) {
    html += '<div class="reviewing-banner">' + icon('layout-grid',14) + ' Reviewing question ' + (s.viewIndex+1) + ' of ' + s.ids.length + ' — already answered.' +
      '<button class="link-btn" data-action="jump-to-current">Jump to current question ' + icon('chevron-right',12) + '</button></div>';
  }

  var nextM = state.mcqs.find(function(x){ return x.id === s.ids[s.index+1]; });
  var nextLabel = nextM && nextM.learning ? LearningEngine.classify(nextM) : (nextM ? 'new' : null);
  html += '<div class="practice-progress"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
    '<div class="progress-label">' + (s.index+1) + ' / ' + s.ids.length +
    (nextLabel ? '<br>Next: ' + escapeHtml(nextLabel) : '') + '</div></div>';

  html += '<div class="card answer-sheet">';
  html += '<div class="qmeta"><span class="qnum mono">Q.' + (s.viewIndex+1) + '</span><div class="qmeta-tags">' +
    '<span class="source-pill" style="background:' + colorForSource(m.source) + '">' + escapeHtml(m.source) + '</span>' +
    m.tags.map(function(t){ return '<span class="tag-pill">' + escapeHtml(t) + '</span>'; }).join('') +
    '</div></div>';

  if (m.passage) html += '<div class="passage-box">' + renderContent(m.passage) + '</div>';
  html += '<div class="qtext">' + renderContent(m.question) + '</div>';
  if (m.images && m.images.length) {
    html += '<div class="qimage-grid">' + m.images.map(function(hash){
      return '<div class="qimage-thumb"><img data-hash-src="' + escapeHtml(hash) + '" data-action="view-mcq-image" data-hash="' + escapeHtml(hash) + '" alt=""></div>';
    }).join('') + '</div>';
  }

  if (m.isShortAnswer) {
    html += '<div class="short-answer-box"><textarea id="shortAnswerInput" placeholder="Type your answer, then reveal to check yourself" ' + (viewRevealed ? 'disabled' : '') + '>' + escapeHtml(viewSelected||'') + '</textarea></div>';
    if (!viewRevealed) {
      html += '<div class="answer-footer" style="justify-content:flex-end;"><button class="btn btn-primary" data-action="reveal-short">Reveal answer</button></div>';
    }
  } else {
    if (m.answer.length > 1) {
      html += '<div class="multi-select-hint">' + icon('check-circle',13) + ' Select all that apply — ' + m.answer.length + ' correct answers</div>';
    }
    html += '<div class="bubbles">';
    m.options.forEach(function(opt){
      var isSelected = viewSelected && viewSelected.indexOf(opt.letter) !== -1;
      var isCorrectLetter = m.answer.indexOf(opt.letter) !== -1;
      var cls = 'bubble';
      if (isSelected) cls += ' selected';
      if (viewRevealed) {
        cls += ' locked';
        if (isCorrectLetter) cls += ' reveal-correct';
        else if (isSelected) cls += ' reveal-wrong';
      }
      html += '<button class="' + cls + '" ' + (isReviewing || viewRevealed ? 'disabled' : '') + ' data-action="select-option" data-letter="' + opt.letter + '">' +
        '<span class="bubble-mark"><span class="bubble-letter">' + opt.letter + '</span></span>' +
        '<span class="bubble-text">' + escapeHtml(opt.text) + '</span></button>';
    });
    html += '</div>';
    if (!viewRevealed) {
      html += '<div class="answer-footer" style="justify-content:flex-end;">' +
        '<button class="btn btn-primary" data-action="reveal-mcq"' + (s.selected && s.selected.length ? '' : ' disabled') + '>Check answer</button></div>';
    }
  }

  if (viewRevealed) {
    var needsSelfGrade = !isReviewing && m.isShortAnswer && s.shortAnswerCorrect === null;
    var isCorrect = isReviewing ? (result ? result.correct : null) : evaluateCorrect(m, s.selected);
    html += '<div class="reveal-panel">';
    if (needsSelfGrade) {
      html += '<div class="reveal-verdict pending">Grade yourself</div>';
    } else {
      html += '<div class="reveal-verdict ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? 'Correct' : (m.answer[0]==='UNKNOWN' ? 'No answer key on record' : 'Not quite')) + '</div>';
    }
    if (!m.isShortAnswer && m.answer[0] !== 'UNKNOWN') {
      html += '<div class="view-sub" style="margin-bottom:8px;">Correct answer: ' + m.answer.join(', ') + '</div>';
    }
    if (m.isShortAnswer) {
      html += '<div class="view-sub" style="margin-bottom:8px;">Answer on record: ' + escapeHtml(m.answer[0]) + '</div>';
    }
    html += renderReveal(m);
    html += renderNotesSection(m); /* end of explanation, always — this is the one spot notes show during practice, deliberately never before reveal */
    if (isReviewing) {
      /* Nothing to submit here — movement happens via the Prev/Next/Overview controls up top. */
    } else if (needsSelfGrade) {
      html += '<div class="view-sub" style="margin-top:14px;">Compare your answer above with the record — did you get it right?</div>';
      html += '<div class="answer-footer" style="justify-content:flex-end;gap:10px;">' +
        '<button class="btn btn-danger" data-action="self-grade" data-correct="false">' + icon('x',15) + ' I was wrong</button>' +
        '<button class="btn btn-primary" data-action="self-grade" data-correct="true">' + icon('check-circle',15) + ' I was right</button></div>';
    } else {
      html += '<div class="answer-footer" style="justify-content:flex-end;">' +
        '<button class="btn btn-primary" data-action="next-question">' + (s.index + 1 < s.ids.length ? 'Next question' : 'Finish session') + '</button></div>';
    }
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

/* Multi-answer ("select all that apply") questions toggle each option in/out of the
   selection; single-answer questions replace the whole selection with just this one. */
function toggleOptionSelection(m, s, letter){
  if (m.answer.length > 1) {
    var sel = s.selected ? s.selected.slice() : [];
    var idx = sel.indexOf(letter);
    if (idx === -1) sel.push(letter); else sel.splice(idx, 1);
    s.selected = sel;
  } else {
    s.selected = [letter];
  }
}

function evaluateCorrect(m, selected){
  if (!selected) return false;
  if (m.isShortAnswer) {
    var sg = state.session && state.session.shortAnswerCorrect;
    return sg === true ? true : (sg === false ? false : null); /* null = not self-graded yet */
  }
  if (m.answer.indexOf('UNKNOWN') !== -1) return null;
  var a = selected.slice().sort().join(',');
  var b = m.answer.slice().sort().join(',');
  return a === b;
}

function revealCurrent(){
  var s = state.session;
  s.revealed = true;
  s.lastTimeToAnswerMs = s.questionShownAt ? (Date.now() - s.questionShownAt) : null; /* silent timing — how long they deliberated before checking */
  s.revealedAt = Date.now();
  render();
}

async function advanceAfterReveal(){
  var s = state.session;
  var m = state.mcqs.find(function(x){ return x.id === s.ids[s.index]; });
  if (!m) return;
  var correct = evaluateCorrect(m, s.selected);
  var pickedStr = m.isShortAnswer ? (s.selected || '') : (s.selected ? s.selected.join(',') : '');
  var timeToAnswerMs = s.lastTimeToAnswerMs;
  var timeOnExplanationMs = s.revealedAt ? (Date.now() - s.revealedAt) : null;

  if (!s.undoStack) s.undoStack = [];
  s.undoStack.push({
    mcqId: m.id,
    learningBefore: JSON.parse(JSON.stringify(m.learning)),
    asleepBefore: m.asleep,
    statsBefore: JSON.parse(JSON.stringify(s.stats)),
    resultsLenBefore: s.results.length,
    index: s.index,
    selected: s.selected
  });

  LearningEngine.record(m, pickedStr, correct, timeToAnswerMs, timeOnExplanationMs); /* rating is auto-derived inside, from this question's own history and how long it took */

  var cls = LearningEngine.classify(m);
  if (s.stats && s.stats[cls] !== undefined) s.stats[cls]++;
  if (correct === true) s.stats.correct++;
  if (correct === false) s.stats.wrong++;

  s.results.push({ id: m.id, correct: correct, selected: s.selected });
  bumpStreak();

  var justAutoSlept = m.autoSlept;
  if (justAutoSlept) m.autoSlept = false; // one-shot — don't re-toast on a future render

  s.index++; s.selected = null; s.revealed = false; s.shortAnswerCorrect = null; s.viewIndex = s.index;
  s.questionShownAt = Date.now(); s.revealedAt = null; s.lastTimeToAnswerMs = null; /* start the clock fresh for whatever's next */
  if (s.index >= s.ids.length) state.view = 'summary';
  render(); /* update the screen immediately — don't make the person wait on a network round trip just to see the next question */
  saveLibrary(); /* fire-and-forget in the background; it has its own error toast if it fails */
  if (justAutoSlept) showToast('That question is asleep now — ' + (state.autoSleepStreak||4) + ' correct in a row. Wake it anytime from its row in the library.');
}

async function undoLastAnswer(){
  var s = state.session;
  if (!s || !s.undoStack || !s.undoStack.length) return;
  var last = s.undoStack.pop();
  var mm = state.mcqs.find(function(x){ return x.id === last.mcqId; });
  if (mm) {
    mm.learning = last.learningBefore;
    if ('asleepBefore' in last) mm.asleep = last.asleepBefore; /* undo the auto-sleep too, if that's what this attempt triggered */
  }
  s.results.length = last.resultsLenBefore;
  s.stats = last.statsBefore;
  s.index = last.index;
  s.viewIndex = s.index;
  s.selected = last.selected;
  s.revealed = true;
  s.shortAnswerCorrect = null; /* re-grade on the way back in, rather than trusting a stale self-grade */
  s.revealedAt = Date.now(); s.lastTimeToAnswerMs = null; /* fresh timing for whatever rating they give it this time */
  render();
  saveLibrary();
}

function renderSummary(){
  var s = state.session;
  var total = s.results.length;
  var correct = s.results.filter(function(r){ return r.correct === true; }).length;
  var scored = s.results.filter(function(r){ return r.correct !== null; }).length;
  var pct = scored ? Math.round((correct / scored) * 100) : 0;
  var byId = {}; state.mcqs.forEach(function(m){ byId[m.id] = m; });

  var classCounts = { mastered:0, learning:0, misconception:0, noconcept:0 };
  s.results.forEach(function(r){
    var m = byId[r.id];
    if (!m || !m.learning) return;
    var cls = LearningEngine.classify(m);
    if (classCounts[cls] !== undefined) classCounts[cls]++;
  });

  var html = '<div class="practice-wrap"><div class="card summary-card">';
  html += '<div class="score-ring' + (pct >= 60 ? ' good' : '') + '"><div class="score-big serif">' + pct + '%</div><div class="score-sub">' + correct + ' / ' + scored + ' scored</div></div>';
  html += '<div class="serif" style="font-size:19px;">Session complete</div>';
  html += '<div class="view-sub">' + total + ' question' + (total===1?'':'s') + ' attempted this round.</div>';

  html += '<div class="summary-breakdown">';
  html += '<div class="summary-row"><span>Questions</span><span>' + total + '</span></div>';
  html += '<div class="summary-row"><span>Accuracy</span><span>' + pct + '%</span></div>';
  html += '<div class="summary-row"><span>Mastered</span><span>' + classCounts.mastered + '</span></div>';
  html += '<div class="summary-row"><span>Learning</span><span>' + classCounts.learning + '</span></div>';
  html += '<div class="summary-row"><span>Misconceptions</span><span>' + classCounts.misconception + '</span></div>';
  html += '<div class="summary-row"><span>No Concept</span><span>' + classCounts.noconcept + '</span></div>';
  html += '</div>';

  var wrongIds = s.results.filter(function(r){ return r.correct === false; }).map(function(r){ return r.id; });
  html += '<div class="action-row" style="justify-content:center;margin-top:22px;">';
  if (wrongIds.length) html += '<button class="btn btn-primary" data-action="retry-wrong" data-ids="' + wrongIds.join(',') + '">Retry the ' + wrongIds.length + ' missed</button>';
  html += '<button class="btn btn-ghost" data-action="back-to-library">Back to library</button>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

/* ---------------- Events ---------------- */
function bindEvents(){
  var statusSel = document.querySelector('[data-action="set-status-filter"]');
  if (statusSel) statusSel.addEventListener('change', function(e){ state.filters.status = e.target.value; render(); });
  var searchInput = document.getElementById('globalSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function(e){
      state.filters.search = e.target.value;
      var cursorPos = e.target.selectionStart;
      render();
      var newInput = document.getElementById('globalSearchInput');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    });
  }
}

async function onClick(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'toggle-sidebar') { state.sidebarOpen = !state.sidebarOpen; render(); return; }
  if (action === 'manual-sync') { manualSync(); return; }
  if (action === 'set-view') { if (guardNavigation(action, el)) return; state.view = el.getAttribute('data-view'); state.sidebarOpen = false; render(); return; }
  if (action === 'open-dashboard') { if (guardNavigation(action, el)) return; state.view = 'dashboard'; state.sidebarOpen = false; render(); return; }
  if (action === 'toggle-fsrs-mode') {
    state.learningMode.enabled = !state.learningMode.enabled;
    saveFsrsMode();
    showToast('FSRS Mode ' + (state.learningMode.enabled ? 'enabled' : 'disabled'));
    render();
    return;
  }
  if (action === 'toggle-auto-sleep') {
    state.autoSleepEnabled = !state.autoSleepEnabled;
    saveAutoSleepSettings();
    render();
    return;
  }
  if (action === 'recompute-due-dates') {
    var changedCount = recomputeAllDueDates();
    showToast(changedCount ? changedCount + ' question' + (changedCount===1?'':'s') + ' re-scheduled with the current rules.' : 'Nothing to change — everything\'s already scheduled with the current rules.');
    render();
    saveLibrary();
    return;
  }
  if (action === 'toggle-fsrs-card') {
    state.fsrsCardExpanded = !state.fsrsCardExpanded;
    saveFsrsCardExpanded();
    render();
    return;
  }
  if (action === 'toggle-subject-sleep') {
    var subj = el.getAttribute('data-subject');
    if (state.sleepingSubjects[subj]) {
      delete state.sleepingSubjects[subj];
      showToast('"' + subj + '" is awake again — back in FSRS review.');
    } else {
      state.sleepingSubjects[subj] = true;
      showToast('"' + subj + '" is now asleep — paused from FSRS review and Start Practice on the root page.');
    }
    saveSleepingSubjects();
    render();
    return;
  }
  if (action === 'toggle-mcq-sleep') {
    var mqId = el.getAttribute('data-id');
    var mq = state.mcqs.find(function(x){ return x.id === mqId; });
    if (!mq) return;
    mq.asleep = !mq.asleep;
    if (!mq.asleep) mq.autoSlept = false; // waking it manually also clears the auto-slept flag
    showToast(mq.asleep ? 'Question asleep — paused from FSRS review everywhere.' : 'Question awake again — back in FSRS review.');
    render();
    saveLibrary();
    return;
  }
  if (action === 'toggle-dark-mode') {
    state.darkMode = !state.darkMode;
    saveDarkMode();
    render();
    return;
  }
  if (action === 'export-library') { exportLibrary(); return; }
  if (action === 'import-library') {
    var fi = document.getElementById('importFileInput');
    if (fi) fi.click();
    return;
  }
  if (action === 'open-settings') { openSettingsModal(); return; }
  if (action === 'sign-out') { signOutUser(); return; }
  if (action === 'google-sign-in') { signInWithGoogle(); return; }
  if (action === 'start-queue-preview') { state.view = 'queuepreview'; state.sidebarOpen = false; render(); return; }
  if (action === 'start-due-session') {
    var dueIds = getLearningQueue(state.mcqs.map(function(m){return m.id;}));
    requestStartPractice(dueIds, true);
    return;
  }
  if (action === 'start-study-ahead') {
    var tomorrow = Date.now() + 86400000;
    var byId = {}; state.mcqs.forEach(function(m){ byId[m.id]=m; });
    var ids = state.mcqs.filter(function(q){ return (q.learning.due||0) <= tomorrow; }).map(function(q){ return q.id; });
    requestStartPractice(ids, true);
    return;
  }
  if (action === 'start-practice-all') {
    var allIds = state.mcqs.map(function(m){ return m.id; });
    requestStartPractice(allIds, false);
    return;
  }

  if (action === 'toggle-node') {
    var key = el.getAttribute('data-path');
    state.expanded[key] = !state.expanded[key];
    render(); return;
  }
  if (action === 'select-node') {
    if (guardNavigation(action, el)) return;
    var key2 = el.getAttribute('data-path');
    state.selectedPath = key2.split('␟');
    state.view = 'browse';
    state.expanded[key2] = true;
    state.forceList = false;
    state.sidebarOpen = false;
    resetFolderFilters();
    render(); return;
  }
  if (action === 'view-node-questions') {
    var key4 = el.getAttribute('data-path');
    state.selectedPath = key4.split('␟');
    state.view = 'browse';
    state.expanded[key4] = true;
    state.forceList = true;
    state.sidebarOpen = false;
    resetFolderFilters();
    render(); return;
  }
  if (action === 'clear-selection') { state.view = 'browse'; state.selectedPath = null; state.forceList = false; resetFolderFilters(); state.sidebarOpen = false; render(); return; }

  if (action === 'toggle-source-filter') {
    var s = el.getAttribute('data-source');
    state.filters.sources[s] = !state.filters.sources[s];
    render(); return;
  }
  if (action === 'toggle-tag-filter') {
    var tg = el.getAttribute('data-tag');
    state.filters.tags[tg] = !state.filters.tags[tg];
    render(); return;
  }
  if (action === 'toggle-tag-panel') {
    state.filters.tagPanelOpen = !state.filters.tagPanelOpen;
    render(); return;
  }
  if (action === 'clear-all-filters') {
    state.filters.sources = {};
    state.filters.tags = {};
    state.filters.status = 'all';
    render(); return;
  }
  if (action === 'clear-search') {
    state.filters.search = '';
    render();
    var si = document.getElementById('globalSearchInput');
    if (si) si.focus();
    return;
  }

  if (action === 'start-practice') {
    var tree = buildTree();
    var node = state.selectedPath ? getNodeByPath(tree, state.selectedPath) : null;
    var ids = node ? collectIds(node) : state.mcqs.map(function(m){ return m.id; });
    var byId = {}; state.mcqs.forEach(function(m){ byId[m.id]=m; });
    if (!node) ids = ids.filter(function(id){ return byId[id] && !state.sleepingSubjects[byId[id].subject]; }); /* root-level "Start Practice" skips sleeping subjects entirely */
    ids = ids.filter(function(id){ return byId[id] && !byId[id].asleep; }); /* individually-slept questions are excluded everywhere, not just from the root */
    var filtered = ids.filter(function(id){ return byId[id] && passesFilters(byId[id]); });
    requestStartPractice(filtered, state.learningMode.enabled);
    return;
  }
  if (action === 'export-current-view') {
    /* Deliberately mirrors renderQuestionList()'s own list computation exactly (not
       start-practice's, which is close but doesn't account for an active search) —
       the whole point is "export exactly what's on screen right now". */
    var expSearchAll = !!(state.filters.search || '').trim();
    var expTree = buildTree();
    var expNode = state.selectedPath ? getNodeByPath(expTree, state.selectedPath) : null;
    var expIds = (expSearchAll || !expNode) ? state.mcqs.map(function(m){ return m.id; }) : collectIds(expNode);
    var expById = {}; state.mcqs.forEach(function(m){ expById[m.id] = m; });
    var expList = expIds.map(function(id){ return expById[id]; }).filter(Boolean).filter(passesFilters);
    var expLabel = expSearchAll ? 'search-results' : (state.selectedPath ? state.selectedPath[state.selectedPath.length-1].toLowerCase().replace(/[^a-z0-9]+/g,'-') : 'all-subjects');
    exportMcqSubset(expList, expLabel);
    return;
  }

  if (action === 'preview-mcq') {
    var id = el.getAttribute('data-id');
    requestStartPractice([id], false);
    return;
  }

  if (action === 'copy-prompt') {
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(MASTER_PROMPT);
        copied = true;
      }
    } catch(err) { copied = false; }
    if (!copied) {
      /* Fallback for contexts where the async Clipboard API is blocked (e.g. sandboxed
         preview iframes without clipboard-write permission delegated) — the older
         execCommand path works in more of those environments. */
      try {
        var ta = document.createElement('textarea');
        ta.value = MASTER_PROMPT;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch(err2) { copied = false; }
    }
    if (copied) {
      showToast('Prompt copied — paste it into your LLM of choice.');
    } else {
      var pb = document.getElementById('promptBox');
      if (pb && window.getSelection) {
        var range = document.createRange();
        range.selectNodeContents(pb);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      showToast('Could not copy automatically — the prompt text below is now selected, press Ctrl/Cmd+C to copy.');
    }
    return;
  }

  if (action === 'clear-ingest') {
    document.getElementById('ingestArea').value = '';
    document.getElementById('parseReport').innerHTML = '';
    return;
  }

  if (action === 'download-id-sheet') { downloadIdSheet(); return; }
  if (action === 'confirm-import-file') { confirmImportWithChoice(el.getAttribute('data-reset') === 'true'); return; }
  if (action === 'cancel-import-file') { state.pendingImportPayload = null; closeModal(); return; }

  if (action === 'open-add-note') { openAddNoteModal(el.getAttribute('data-id')); return; }
  if (action === 'cancel-add-note') {
    state.pendingNoteDraft = null;
    if (state.editingMcqId) openEditModal(state.editingMcqId); else closeModal();
    return;
  }
  if (action === 'add-note-draft-image') {
    var noteFi = document.getElementById('noteImageFileInput');
    if (noteFi) noteFi.click();
    return;
  }
  if (action === 'remove-note-draft-image') {
    if (state.pendingNoteDraft) {
      var rmHash2 = el.getAttribute('data-hash');
      state.pendingNoteDraft.images = state.pendingNoteDraft.images.filter(function(h){ return h !== rmHash2; });
      renderNoteDraftImageGrid();
    }
    return;
  }
  if (action === 'save-note') {
    var noteMcqId = el.getAttribute('data-id');
    var noteM = state.mcqs.find(function(x){ return x.id === noteMcqId; });
    var noteTextEl = document.getElementById('noteTextInput');
    var noteText = noteTextEl ? noteTextEl.value.trim() : '';
    var noteImages = state.pendingNoteDraft ? state.pendingNoteDraft.images.slice() : [];
    if (!noteText && !noteImages.length) { showToast('Write something or add an image first.'); return; }
    if (noteM) {
      if (!Array.isArray(noteM.notes)) noteM.notes = [];
      noteM.notes.push({ id: uid(), text: noteText, images: noteImages, createdAt: Date.now() });
    }
    state.pendingNoteDraft = null;
    if (state.editingMcqId) openEditModal(state.editingMcqId); else closeModal();
    render();
    showToast('Note added.');
    saveLibrary();
    return;
  }
  if (action === 'delete-note') {
    var delNoteMcqId = el.getAttribute('data-id'), delNoteId = el.getAttribute('data-note-id');
    var delNoteM = state.mcqs.find(function(x){ return x.id === delNoteMcqId; });
    if (delNoteM && Array.isArray(delNoteM.notes)) {
      delNoteM.notes = delNoteM.notes.filter(function(n){ return n.id !== delNoteId; });
      if (state.editingMcqId) openEditModal(state.editingMcqId); else render();
      showToast('Note deleted.');
      saveLibrary();
    }
    return;
  }
  if (action === 'upload-image-zip') {
    var zipInput = document.getElementById('imageZipInput');
    var zipFile = zipInput && zipInput.files && zipInput.files[0];
    if (!zipFile) { showToast('Choose a .zip file first.'); return; }
    requestNotificationPermissionIfNeeded(); /* must happen synchronously off this click — a real user gesture, not an unsolicited prompt */
    processImageZip(zipFile);
    return;
  }

  if (action === 'parse-preview') {
    var raw = document.getElementById('ingestArea').value;
    var override = document.getElementById('sourceOverrideInput').value.trim();
    if (!raw.trim()) { showToast('Paste some standardized MCQ text first.'); return; }
    var result = parseLibraryText(raw, override || null);
    var reportEl = document.getElementById('parseReport');
    if (!result.mcqs.length) {
      reportEl.innerHTML = '<div class="parse-report" style="color:var(--pen-red);">No valid #Q blocks found. Check the format against the prompt above.</div>';
      return;
    }
    var bySubj = {};
    result.mcqs.forEach(function(m){ bySubj[m.subject] = (bySubj[m.subject]||0) + 1; });
    var subjSummary = Object.keys(bySubj).map(function(k){ return k + ' (' + bySubj[k] + ')'; }).join(', ');
    var reportHtml = '<div class="parse-report"><span class="parse-ok">' + result.mcqs.length + ' questions parsed</span> — ' + escapeHtml(subjSummary) + '</div>';
    if (result.errors.length) {
      reportHtml += '<div class="parse-err-list">' + result.errors.length + ' block(s) skipped:<br>' +
        result.errors.slice(0,15).map(function(er){ return '· ' + escapeHtml(er.message); }).join('<br>') + '</div>';
    }
    reportHtml += '<div class="action-row"><button class="btn btn-primary" data-action="confirm-import">Import ' + result.mcqs.length + ' questions</button></div>';
    reportEl.innerHTML = reportHtml;
    reportEl._pending = result.mcqs;
    return;
  }

  if (action === 'confirm-import') {
    var reportEl2 = document.getElementById('parseReport');
    var pending = reportEl2 && reportEl2._pending;
    if (!pending || !pending.length) return;
    pending.forEach(function(m){
      if (!state.sources[m.source]) state.sources[m.source] = { color: colorForSource(m.source) };
    });
    state.mcqs = state.mcqs.concat(pending);
    document.getElementById('ingestArea').value = '';
    state.view = 'browse';
    showToast('Saving ' + pending.length + ' question' + (pending.length===1?'':'s') + '…');
    render();
    /* Deliberately AWAITED, not fire-and-forget — this is exactly the operation that
       broke before: showing "success" and letting you navigate/reload away while the
       actual Supabase write was still in flight meant a reload could abort it before
       it ever reached the server, silently losing the whole import. Bulk import is
       rare enough that the extra wait is worth the correctness; frequent taps
       (Next question, Bookmark, etc.) stay optimistic on purpose. */
    await saveLibrary();
    await saveSources();
    if (state.lastSaveHadPermanentConflict) {
      /* saveLibrary() already showed a specific explanation — don't pile a misleading
         "success" message on top of it. */
    } else if (state.hasUnsyncedChanges) {
      showToast(pending.length + ' question' + (pending.length===1?'':'s') + ' saved locally — will sync once you\'re back online.');
    } else {
      showToast(pending.length + ' question' + (pending.length===1?'':'s') + ' imported and saved.');
    }
    return;
  }

  if (action === 'delete-source') {
    var srcName = el.getAttribute('data-source');
    if (!confirm('Delete "' + srcName + '" and all its MCQs? This cannot be undone.')) return;
    var removedSrcIds = state.mcqs.filter(function(m){ return m.source === srcName; }).map(function(m){ return m.id; });
    state.mcqs = state.mcqs.filter(function(m){ return m.source !== srcName; });
    delete state.sources[srcName];
    showToast('Deleting source…');
    render();
    /* Awaited, and an explicit delete rather than an upsert of what's left — upsert
       only ever updates/inserts rows present in the payload, it never removes rows
       that are simply missing from it, so this always needed a real DELETE call. */
    await deleteMcqRows(removedSrcIds);
    await saveSources();
    showToast('Source deleted.');
    return;
  }

  if (action === 'clear-all') {
    if (!confirm('Delete your entire Practex library? This cannot be undone.')) return;
    var allMcqIds = state.mcqs.map(function(m){ return m.id; });
    state.mcqs = [];
    state.sources = {};
    state.selectedPath = null;
    showToast('Clearing your library…');
    render();
    await deleteMcqRows(allMcqIds); /* same reasoning as delete-source above — upsert can't remove rows */
    await saveSources();
    showToast('Library cleared.');
    return;
  }

  if (action === 'close-modal') { state.pendingNav = null; closeModal(); return; }
  if (action === 'modal-backdrop-close') { if (e.target === el) { state.pendingNav = null; closeModal(); } return; }
  if (action === 'view-history') { openHistoryModal(el.getAttribute('data-id')); return; }
  if (action === 'edit-mcq') { openEditModal(el.getAttribute('data-id')); return; }
  if (action === 'save-edit-mcq') { saveEditMcq(el.getAttribute('data-id')); return; }

  if (action === 'add-mcq-image') {
    var addField = el.getAttribute('data-field') || 'images';
    var fi = document.getElementById(addField === 'answerImages' ? 'mcqAnswerImageFileInput' : 'mcqImageFileInput');
    if (fi) fi.click();
    return;
  }
  if (action === 'remove-mcq-image') {
    var rmId = el.getAttribute('data-id'), rmHash = el.getAttribute('data-hash');
    var rmField = el.getAttribute('data-field') || 'images';
    var rmM = state.mcqs.find(function(x){ return x.id === rmId; });
    if (rmM && rmM[rmField]) {
      rmM[rmField] = rmM[rmField].filter(function(h){ return h !== rmHash; });
      renderMcqImageGrid(rmM, rmField, rmField === 'answerImages' ? 'mcqAnswerImageGrid' : 'mcqImageGrid');
      showToast('Image removed.');
      await saveLibrary();
      await purgeOrphanedImageHashes([rmHash]); /* only actually deletes it if no other question still uses this hash */
    }
    return;
  }
  if (action === 'view-mcq-image') { openImageLightbox(el.getAttribute('data-hash')); return; }
  if (action === 'close-lightbox') {
    if (state.editingMcqId) openEditModal(state.editingMcqId);
    else closeModal();
    return;
  }

  if (action === 'open-deck-menu') { openDeckMenu(el.getAttribute('data-path')); return; }

  if (action === 'deck-rename') { openRenameDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-rename-deck') {
    var rPath = el.getAttribute('data-path');
    var rInput = document.getElementById('renameDeckInput');
    var rNewName = rInput ? rInput.value : '';
    if (renameDeck(rPath.split('␟'), rNewName)) {
      closeModal(); render();
      /* Awaited — a rename/move/copy/delete is rare and high-stakes enough that
         showing "done" and letting a reload interrupt the actual save (aborting it
         mid-flight, same failure mode that lost imports) is worse than the extra
         half-second wait. Frequent taps during practice stay optimistic on purpose. */
      await saveLibrary(); await saveSleepingSubjects();
      showToast('Renamed to "' + rNewName.trim() + '".');
    } else {
      showToast('Enter a name first.');
    }
    return;
  }

  if (action === 'deck-move') { openMoveDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-move-deck') {
    var mvPath = el.getAttribute('data-path');
    var mvArr = mvPath.split('␟');
    var mvSelect = document.getElementById('moveDeckSelect');
    var mvNewInput = document.getElementById('moveDeckNewInput');
    var mvDest = (mvNewInput && mvNewInput.value.trim()) ? mvNewInput.value.trim() : (mvSelect ? mvSelect.value : '');
    if (!mvDest) { showToast('Pick or type a destination subject first.'); return; }
    var movedName = mvArr[mvArr.length-1];
    if (mvDest === '__LIBRARY_ROOT__') {
      moveDeckUnder(mvArr, []);
      closeModal(); render();
      await saveLibrary();
      showToast('"' + movedName + '" is now a top-level subject in the Library.');
      return;
    }
    if (isPathWithinOrEqual([mvDest], mvArr)) { showToast('Can\'t move a deck into itself.'); return; }
    moveDeckUnder(mvArr, [mvDest]);
    closeModal(); render();
    await saveLibrary();
    showToast('Moved "' + movedName + '" under "' + mvDest + '".');
    return;
  }

  if (action === 'deck-copy') {
    var cpPath = el.getAttribute('data-path');
    var cpCount = duplicateDeck(cpPath.split('␟'));
    closeModal(); render();
    await saveLibrary();
    showToast('Copied — ' + cpCount + ' question' + (cpCount===1?'':'s') + ' duplicated as "' + cpPath.split('␟').pop() + ' (copy)".');
    return;
  }

  if (action === 'deck-cut') {
    var cutPath = el.getAttribute('data-path');
    var cutArr = cutPath.split('␟');
    state.clipboardNode = { path: cutArr, name: cutArr[cutArr.length-1] };
    closeModal(); render();
    showToast('"' + state.clipboardNode.name + '" cut — navigate to a destination and choose "Paste here".');
    return;
  }
  if (action === 'cancel-cut') { state.clipboardNode = null; render(); return; }
  if (action === 'paste-node-here') {
    if (!state.clipboardNode) { render(); return; }
    var destPath = el.getAttribute('data-path');
    var destPathArr = destPath ? destPath.split('␟') : [];
    if (!destPathArr.length) {
      if (state.clipboardNode.path.length === 1) {
        showToast('That\'s already at the Library root.');
        state.clipboardNode = null; render();
        return;
      }
      var promotedName = state.clipboardNode.name;
      moveDeckUnder(state.clipboardNode.path, []);
      state.clipboardNode = null;
      render();
      await saveLibrary();
      showToast('"' + promotedName + '" moved to the Library root as a top-level subject.');
      return;
    }
    if (isPathWithinOrEqual(destPathArr, state.clipboardNode.path)) {
      showToast(destPathArr.join(' / ') === state.clipboardNode.path.join(' / ') ? 'That\'s already where it is.' : 'Can\'t paste a deck into itself.');
      if (destPathArr.join(' / ') === state.clipboardNode.path.join(' / ')) state.clipboardNode = null;
      render();
      return;
    }
    moveDeckUnder(state.clipboardNode.path, destPathArr);
    var pastedName = state.clipboardNode.name;
    state.clipboardNode = null;
    render();
    await saveLibrary();
    showToast('"' + pastedName + '" moved here.');
    return;
  }

  if (action === 'deck-delete') { openDeleteDeckModal(el.getAttribute('data-path')); return; }
  if (action === 'confirm-delete-deck') {
    var delPath = state.pendingDeckDelete;
    state.pendingDeckDelete = null;
    if (delPath) {
      var delArr = delPath.split('␟');
      var removedMcqs = deleteDeck(delArr);
      var removedIds = removedMcqs.map(function(m){ return m.id; });
      if (state.selectedPath && state.selectedPath.join('␟').indexOf(delPath) === 0) {
        state.selectedPath = null; state.forceList = false;
      }
      closeModal(); render();
      showToast('Deleted ' + removedIds.length + ' question' + (removedIds.length===1?'':'s') + '.');
      var candidateHashes = [];
      removedMcqs.forEach(function(m){
        (m.images || []).forEach(function(h){ candidateHashes.push(h); });
        (m.answerImages || []).forEach(function(h){ candidateHashes.push(h); });
      });
      await deleteMcqRows(removedIds);
      await purgeOrphanedImageHashes(candidateHashes);
    } else {
      closeModal();
    }
    return;
  }
  if (action === 'leave-practice') { requestLeavePractice(); return; }
  if (action === 'pause-and-leave') {
    state.pausedSession=currentSessionSnapshot();
    if (state.pausedSession) {
      state.pausedSession.pausedAt = Date.now();
      state.pausedSession.learningEnabled = state.learningMode.enabled; // see resume-paused for why this matters
    }
    state.session=null; applyPendingNav(); closeModal(); render();
    showToast('Pausing…');
    /* Awaited — this is exactly the highest-risk spot for a fire-and-forget save:
       pausing a test is almost always immediately followed by closing the tab or
       switching devices, precisely when a background save is most likely to get
       cut off mid-flight. Worth the brief wait for the pause to actually be
       guaranteed on the server before the person walks away from this screen. */
    await saveUserSettings();
    if (state.lastSaveHadPermanentConflict) {
      /* saveUserSettings doesn't currently set this, but stay consistent with the
         pattern used elsewhere in case that ever changes. */
    } else if (state.hasUnsyncedChanges) {
      showToast('Paused locally — will sync to your other devices once you\'re back online.');
    } else {
      showToast('Paused — resume it from any device.');
    }
    return;
  }
  if (action === 'leave-without-pausing') {
    state.session=null; applyPendingNav(); closeModal(); render(); return;
  }
  if (action === 'resume-paused') {
    if(!state.pausedSession){ closeModal(); return; }
    var restored = JSON.parse(JSON.stringify(state.pausedSession));
    /* Defensive normalization — a paused session saved by an older version of the app
       (or corrupted some other way) could be missing fields the current code expects.
       Without this, a missing viewIndex specifically made the practice view look up
       s.ids[undefined], find no question, and silently jump straight to a 0%/empty
       summary screen instead of resuming anything. */
    if (!Array.isArray(restored.ids)) restored.ids = [];
    if (typeof restored.index !== 'number' || restored.index < 0) restored.index = 0;
    if (restored.index > restored.ids.length) restored.index = restored.ids.length;
    if (typeof restored.viewIndex !== 'number' || restored.viewIndex < 0 || restored.viewIndex > restored.index) restored.viewIndex = restored.index;
    if (!Array.isArray(restored.results)) restored.results = [];
    if (!Array.isArray(restored.undoStack)) restored.undoStack = [];
    if (!restored.stats) restored.stats = { correct:0, wrong:0, misconception:0, learning:0, mastered:0, noconcept:0 };
    if (restored.shortAnswerCorrect === undefined) restored.shortAnswerCorrect = null;
    if (!restored.ids.length) {
      showToast('That paused test looks corrupted and can\'t be resumed — sorry about that. Starting fresh is the safest option.');
      state.pausedSession = null; closeModal(); render(); savePausedSession(); return;
    }
    // Restore the mode the session was actually PAUSED in — not whatever the
    // global toggle currently happens to be. Without this, resuming (or an
    // abrupt tab-switch auto-pause/restore) could silently drop you into
    // FSRS mode when you left in plain practice mode, or vice versa, any
    // time the global toggle had drifted since — from switching it while
    // browsing elsewhere in the app, from a settings sync landing between
    // pause and resume, anything. A paused session saved before this fix
    // existed won't have learningEnabled at all — falls back to the current
    // global setting in that case, same as before.
    if (typeof restored.learningEnabled === 'boolean') state.learningMode.enabled = restored.learningEnabled;
    state.session = restored;
    state.pausedSession = null;
    state.view = 'practice';
    closeModal();
    render();
    savePausedSession();
    return;
  }
  if (action === 'confirm-new-test') {
    var pending=state.pendingStart; state.pendingStart=null; closeModal();
    if(pending){ state.learningMode.enabled=pending.learningEnabled; startPractice(pending.ids); }
    return;
  }
  if (action === 'jump-subject') {
    state.selectedPath=[el.getAttribute('data-subject')]; state.view='browse'; state.forceList=false; state.expanded[state.selectedPath.join('␟')]=true; resetFolderFilters(); render(); return;
  }

  if (action === 'select-option') {
    if (state.session.revealed) return;
    var letter = el.getAttribute('data-letter');
    var curM = state.mcqs.find(function(x){ return x.id === state.session.ids[state.session.index]; });
    if (curM) toggleOptionSelection(curM, state.session, letter);
    render();
    return;
  }

  if (action === 'reveal-mcq') { revealCurrent(); return; }

  if (action === 'reveal-short') {
    var val = document.getElementById('shortAnswerInput').value.trim();
    state.session.selected = val;
    revealCurrent();
    return;
  }

  if (action === 'next-question') { advanceAfterReveal(); return; }

  if (action === 'self-grade') {
    if (state.session) state.session.shortAnswerCorrect = el.getAttribute('data-correct') === 'true';
    advanceAfterReveal();
    return;
  }

  if (action === 'undo-answer') { undoLastAnswer(); return; }

  if (action === 'practice-prev') {
    if (state.session && state.session.viewIndex > 0) { state.session.viewIndex--; render(); }
    return;
  }
  if (action === 'practice-next') {
    if (state.session && state.session.viewIndex < state.session.index) { state.session.viewIndex++; render(); }
    return;
  }
  if (action === 'jump-to-current') {
    if (state.session) { state.session.viewIndex = state.session.index; render(); }
    return;
  }
  if (action === 'jump-to-question') {
    var jumpIdx = parseInt(el.getAttribute('data-index'), 10);
    if (state.session && jumpIdx >= 0 && jumpIdx <= state.session.index) {
      state.session.viewIndex = jumpIdx;
      closeModal();
      render();
    }
    return;
  }
  if (action === 'open-question-overview') { openQuestionOverview(); return; }

  if (action === 'bookmark-current') {
    var s2 = state.session;
    var m2 = state.mcqs.find(function(x){ return x.id === s2.ids[s2.viewIndex]; });
    m2.flagged = !m2.flagged;
    render();
    saveLibrary();
    return;
  }

  if (action === 'retry-wrong') {
    var ids2 = el.getAttribute('data-ids').split(',').filter(Boolean);
    startPractice(ids2);
    return;
  }

  if (action === 'back-to-library') {
    state.session = null;
    state.view = 'browse';
    render();
    return;
  }
}

/* ---------------- Auth ---------------- */
function userDisplayInfo(user){
  if (!user) return { name: '', email: '', initials: '?', avatarUrl: null };
  var meta = user.user_metadata || {};
  var name = meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Account');
  var initials = name.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){ return w[0].toUpperCase(); }).join('') || '?';
  return { name: name, email: user.email || '', initials: initials, avatarUrl: meta.avatar_url || meta.picture || null };
}
async function signInWithGoogle(){
  if (!supabaseClient) return;
  var errEl = document.getElementById('authError');
  if (errEl) errEl.textContent = '';
  try {
    var res = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname, /* deliberately NOT window.location.href — that can carry forward a stale #hash from a previous sign-in and produce a malformed "##" redirect that Supabase's own client fails to parse */
        queryParams: { prompt: 'select_account' } /* Signing out of Practex only ever clears Practex's own session — it can't and shouldn't touch Google's separate login cookie in the browser. Without this, Google sees that cookie is still there and silently re-authenticates the same account with no picker. This forces the account chooser to actually show, every time. */
      }
    });
    if (res.error) throw res.error;
    /* Browser navigates to Google's consent screen and back — nothing else to do here. */
  } catch(e) {
    console.error('signInWithGoogle:', e);
    if (errEl) errEl.textContent = 'Could not start Google sign-in: ' + (e.message || e);
  }
}
async function signOutUser(){
  if (!supabaseClient) return;
  try {
    await supabaseClient.auth.signOut();
  } catch(e) {
    console.error('signOutUser:', e);
  }
  state.currentUser = null;
  state.mcqs = []; state.sources = {}; state.selectedPath = null; state.session = null; state.imageUrlMap = {};
  if (window.location.hash) {
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  closeModal();
  showAuthGate();
}
function renderAuthGateBody(){
  var body = document.getElementById('authGateBody');
  if (!body) return;
  if (!SUPABASE_CONFIGURED) {
    body.innerHTML =
      '<div class="auth-config-warning">Supabase isn\'t configured yet. Copy <code>config.example.js</code> ' +
      'to <code>config.js</code> in this same folder and fill in your project URL and anon key — see the ' +
      'setup guide for where to find them.</div>';
    return;
  }
  body.innerHTML =
    '<button class="google-signin-btn" data-action="google-sign-in">' + icon('log-in',17) + ' Continue with Google</button>' +
    '<div class="auth-error" id="authError"></div>';
}
function showAuthGate(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'none';
  var gate = document.getElementById('authGate');
  gate.style.display = 'flex';
  renderAuthGateBody();
}
async function showApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingScreen').textContent = 'Loading your library…';
  document.getElementById('appRoot').style.display = 'none';
  await loadLibrary();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'grid';
  render();
}

/* ---------------- Init ---------------- */
async function init(){
  document.body.addEventListener('click', onClick); /* bound once — delegates for both #appRoot, #authGate, and #modalRoot */
  var importInput = document.getElementById('importFileInput');
  if (importInput) {
    importInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (file) handleImportFileSelected(file);
      e.target.value = '';
    });
  }
  /* Paste a screenshot (Ctrl/Cmd+V) straight into the Edit Question modal to attach it —
     bound once here rather than per modal-open, same reasoning as the click delegation
     above: re-binding on every openEditModal() call would stack duplicate listeners. */
  document.addEventListener('paste', function(e){
    if (!state.editingMcqId) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var file = items[i].getAsFile();
        if (file) { e.preventDefault(); attachImageToMcq(state.editingMcqId, file); }
        break;
      }
    }
  });

  /* Every real "you might be reconnected now" moment gets its own listener —
     no single one covers every case. Switching back to the tab and the
     browser's own 'online' event (the one most people miss — it fires even
     if you never left the tab at all, signal just dropped and came back)
     are both genuinely necessary, not redundant. */
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') autoSync(); });
  window.addEventListener('focus', autoSync);
  window.addEventListener('pageshow', function(e){ if (e.persisted) autoSync(); }); // restored from back/forward cache
  window.addEventListener('online', function(){ updateSyncIndicator(); autoSync(); });
  window.addEventListener('offline', updateSyncIndicator);

  /* Auto-pause on tab close/hide — "Pause & leave" only captures a session if the
     person explicitly clicks it first. Just closing the tab mid-test (the far more
     common way people actually leave) previously lost the session entirely, since
     nothing was listening for that at all. 'pagehide' fires reliably even when the
     tab is genuinely closing, unlike most async work at that point — but a real
     network request still can't be trusted to complete once the page is actually
     unloading, so this deliberately only does the SYNCHRONOUS part (persistPausedSessionSync,
     a small dedicated localStorage entry that can't get interrupted) rather than
     awaiting the full IndexedDB mirror write or a Supabase save, neither of which
     are guaranteed to finish once the page is actually closing. loadLibrary()
     reconciles this local-only pause against whatever the cloud has next time the
     app opens — see the comment there. */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden' && isMidSession() && !state.pausedSession) {
      state.pausedSession = currentSessionSnapshot();
      state.pausedSession.pausedAt = Date.now();
      state.pausedSession.learningEnabled = state.learningMode.enabled; // see resume-paused for why this matters
      persistPausedSessionSync();
    }
  });
  window.addEventListener('pagehide', function(){
    if (isMidSession() && !state.pausedSession) {
      state.pausedSession = currentSessionSnapshot();
      state.pausedSession.pausedAt = Date.now();
      state.pausedSession.learningEnabled = state.learningMode.enabled; // see resume-paused for why this matters
      persistPausedSessionSync();
    }
  });

  if ('serviceWorker' in navigator) {
    /* Direct registration, not wrapped in a window 'load' listener — if this
       script runs after the document is already 'complete' (easy to happen
       with a large inline script near the end of <body>), a 'load' listener
       attached at that point would simply never fire. */
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('Service worker registration failed — offline page loading unavailable, everything else is unaffected:', err);
    });
  }

  if (!supabaseClient) {
    document.getElementById('loadingScreen').style.display = 'none';
    showAuthGate();
    return;
  }

  var authInitialized = false;
  supabaseClient.auth.onAuthStateChange(function(event, session){
    /* This is the ONLY onAuthStateChange listener in the app — there used to be a
       second, older one registered here too, with none of the guards below. That
       duplicate is why switching tabs (which triggers a background TOKEN_REFRESHED
       as Supabase silently renews the short-lived access token) was re-triggering
       the full "Loading your library…" screen: the old listener called showApp()
       unconditionally on any SIGNED_IN-shaped event, bypassing every safeguard here.
       TOKEN_REFRESHED/USER_UPDATED should never touch the UI at all — they're pure
       session housekeeping, not a sign-in or sign-out. */
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
      if (session && session.user) state.currentUser = session.user; // keep the session object current, silently
      return;
    }
    if (event === 'SIGNED_OUT') {
      authInitialized = true;
      state.currentUser = null;
      showAuthGate();
      return;
    }
    /* Remaining events: INITIAL_SESSION (fires once on subscribe, waiting for any
       OAuth-redirect token in the URL to finish parsing first) and SIGNED_IN. */
    if (session && session.user) {
      if (authInitialized && state.currentUser && state.currentUser.id === session.user.id) { state.currentUser = session.user; return; } // already loaded — don't reload
      authInitialized = true;
      state.currentUser = session.user;
      /* Explicitly wipe any #access_token=... fragment once it's been consumed, rather
         than assuming the client library already did — leaving it in the address bar is
         what let a stale hash ride along into the next sign-in's redirectTo and produce
         a malformed "##" URL that fails to parse. */
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      showApp();
    } else {
      authInitialized = true;
      state.currentUser = null;
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      showAuthGate();
    }
  });
}
init();


document.addEventListener('keydown', function(e){
  if(state.view!=='practice' || !state.session) return;
  var active=document.activeElement;
  var typing=active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT'||active.isContentEditable);
  if(typing) return;
  var s=state.session;
  var isReviewing = s.viewIndex < s.index;
  var m=state.mcqs.find(function(x){return x.id===s.ids[s.viewIndex];}); /* the question actually on screen, not necessarily the frontier */
  if(!m) return;

  /* Left/Right move between questions regardless of review state — mirrors the
     Prev/Next buttons above the question. */
  if(e.key==='ArrowLeft'){ e.preventDefault(); if(s.viewIndex>0){ s.viewIndex--; render(); } return; }
  if(e.key==='ArrowRight'){ e.preventDefault(); if(s.viewIndex<s.index){ s.viewIndex++; render(); } return; }

  /* Everything below mutates answer state, so it only applies to the current frontier
     question — while reviewing a past one, selecting/revealing/advancing would
     silently act on a different (frontier) question than what's on screen otherwise. */
  if(isReviewing) return;

  /* Number keys 1-9 select the corresponding option (pre-reveal only) */
  if(/^[1-9]$/.test(e.key) && !s.revealed && !m.isShortAnswer){
    var idx=parseInt(e.key,10)-1;
    if(m.options[idx]){ e.preventDefault(); toggleOptionSelection(m, s, m.options[idx].letter); render(); }
    return;
  }

  /* Letter keys (A, B, C, D...) select the option with that letter */
  if(/^[a-zA-Z]$/.test(e.key) && !s.revealed && !m.isShortAnswer){
    var letter=e.key.toUpperCase();
    var match=m.options.filter(function(o){ return o.letter===letter; })[0];
    if(match){ e.preventDefault(); toggleOptionSelection(m, s, letter); render(); return; }
  }

  /* F toggles bookmark */
  if(e.key==='f'||e.key==='F'){
    e.preventDefault(); m.flagged=!m.flagged; saveLibrary(); render(); return;
  }

  /* Space: before reveal, acts as Check Answer (only if something is selected);
     after reveal, advances to the next question — same as clicking "Next question". */
  if(e.code==='Space'){
    e.preventDefault();
    if(!s.revealed){
      var hasSelection = m.isShortAnswer
        ? !!(document.getElementById('shortAnswerInput') && document.getElementById('shortAnswerInput').value.trim())
        : !!(s.selected && s.selected.length);
      if(!hasSelection) return;
      if(m.isShortAnswer){
        s.selected = document.getElementById('shortAnswerInput').value.trim();
      }
      revealCurrent();
    } else {
      if (m.isShortAnswer && s.shortAnswerCorrect === null) return; /* must self-grade via the buttons first — otherwise this would silently record as wrong */
      advanceAfterReveal();
    }
    return;
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Backspace') return;

  var el = document.activeElement;
  var typing = el && (
    el.tagName === 'INPUT' ||
    el.tagName === 'TEXTAREA' ||
    el.tagName === 'SELECT' ||
    el.isContentEditable
  );

  if (typing) return;

  e.preventDefault();

  if (state.view === 'practice' && state.session) { requestLeavePractice(); return; }
  if (state.view !== 'browse') { state.view = 'browse'; state.forceList = false; render(); return; }

  if (!state.selectedPath) return;

  if (state.selectedPath.length === 1) {
    state.selectedPath = null;
    state.forceList = false;
  } else {
    state.selectedPath = state.selectedPath.slice(0, -1);
    state.forceList = false;
  }

  render();
});

})();
</script>
