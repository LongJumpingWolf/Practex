<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
<title>Practex — MCQ Practice</title>
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64x64.png">
<link rel="icon" type="image/png" sizes="128x128" href="icons/icon-128x128.png">
<link rel="icon" type="image/png" sizes="256x256" href="icons/icon-256x256.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/android-chrome-512x512.png">
<meta name="msapplication-TileImage" content="icons/mstile-150x150.png">
<meta name="theme-color" content="#2F5C7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0E9;
  --paper-line:#212A32;
  --card:#FBFAF5;
  --ink:#1F2A33;
  --ink-soft:rgba(31,42,51,0.58);
  --ink-faint:rgba(31,42,51,0.34);
  --rule:#CDD4C9;
  --rule-strong:#AAB3A5;
  --cover:#2F5C7A;
  --cover-dark:#234A63;
  --pen-red:#B23A2E;
  --pen-red-bg:#F5E4E1;
  --pen-green:#2F6E45;
  --pen-green-bg:#E4EFE2;
  --pen-blue:#2F5C7A;
  --pen-blue-bg:#E6EDF2;
  --pen-yellow-bg:#FFF8DD;
  --pen-amber:#8A6D23;
  --pen-amber-bg:#F1E8CC;
  --highlighter:#F0C33C;
  --highlighter-ink:#5B4A0E;
  --shadow-card:0 1px 0 rgba(31,42,51,0.06), 0 10px 24px rgba(31,42,51,0.08);
  --radius:10px;
  /* Fixed "elevated surface" pair for floating UI that must look identical regardless
     of --paper/--ink/--card/--rule (which flip in dark mode). Never mix a flipping
     variable with a hardcoded color for the paired bg/text property — either use
     matching flipping vars (they invert together), matching --overlay vars (fixed),
     or two hardcoded values together. This pair is intentionally NOT redefined
     inside body.dark-mode below. */
  --overlay-bg:#1F2A33;
  --overlay-ink:#FFFFFF;
}
/* FSRS mode re-themes the app (cover/accent colour) so it's visually obvious
   spaced-repetition scheduling is driving what you see. */
body.fsrs-mode{
  --cover:#5C3D80;
  --cover-dark:#432D5E;
}
/* Dark mode: overrides the paper/ink palette; combines with fsrs-mode's accent override. */
body.dark-mode{
  --paper:#1B1F23;
  --paper-line:#3A4149;
  --card:#252A2F;
  --ink:#E7E9EA;
  --ink-soft:rgba(231,233,234,0.62);
  --ink-faint:rgba(231,233,234,0.38);
  --rule:#343B41;
  --rule-strong:#454D55;
  --pen-red:#E0665A;
  --pen-red-bg:#3A2320;
  --pen-green:#4FAE72;
  --pen-green-bg:#1E3324;
  --pen-blue:#6FA8D6;
  --pen-blue-bg:#1B2A38;
  --pen-yellow-bg:#3A320F;
  --pen-amber:#D3B15C;
  --pen-amber-bg:#332A16;
  --highlighter-ink:#F0C33C;
}
body.dark-mode.fsrs-mode{
  --cover:#8362AD;
  --cover-dark:#6B4F92;
}
body.dark-mode{ background-image: linear-gradient(var(--rule) 1px, transparent 1px); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;touch-action:manipulation;}
body{
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px);
  background-size: 100% 32px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Fraunces',Georgia,serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
code.mono{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:0.92em;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
input,textarea,select{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:6px;}

.app-shell{
  display:grid;
  grid-template-columns:288px 1fr;
  min-height:100vh;
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--cover);
  color:#EAF0F5;
  padding:22px 18px 24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:#fff;
}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-size:19px;font-weight:600;letter-spacing:0.2px;}
.brand-tag{font-size:10.5px;color:rgba(234,240,245,0.6);text-transform:uppercase;letter-spacing:1px;margin-top:1px;}

.nav-tabs{display:flex;gap:6px;background:rgba(255,255,255,0.08);padding:4px;border-radius:8px;}
.nav-tab{flex:1;padding:8px 6px;font-size:12.5px;font-weight:600;border-radius:6px;color:rgba(234,240,245,0.72);text-align:center;transition:background .15s,color .15s;}
.nav-tab.active{background:#EAF0F5;color:var(--cover-dark);}

.side-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:rgba(234,240,245,0.55);}

/* FSRS mode switch */
.fsrs-switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0;}
.fsrs-switch-track{position:absolute;inset:0;background:rgba(255,255,255,0.22);border-radius:99px;transition:background .15s;}
.fsrs-switch.on .fsrs-switch-track{background:#F0C33C;}
.fsrs-switch-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#EAF0F5;box-shadow:0 1px 2px rgba(0,0,0,0.3);transition:left .15s;}
.fsrs-switch.on .fsrs-switch-thumb{left:17px;background:#2F2611;}

/* Collapsible FSRS bar */
.fsrs-bar{border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);}
.fsrs-bar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;color:#EAF0F5;}
.fsrs-bar-header:hover{background:rgba(255,255,255,.05);}
.fsrs-bar-body{padding:0 12px 10px;cursor:pointer;color:#EAF0F5;}

/* Main-content search bar (Library view — same viewport as results on all screen sizes) */
.main-search{position:relative;margin-bottom:16px;}
.main-search input{
  width:100%;padding:10px 40px 10px 38px;border-radius:10px;border:1px solid var(--rule-strong);
  background:var(--card);color:var(--ink);font-size:14px;
}
.main-search input::placeholder{color:var(--ink-faint);}
.main-search input:focus{outline:none;border-color:var(--cover);}
.main-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;display:flex;}
.main-search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.main-search-clear:hover{background:var(--paper);color:var(--ink);}

/* Sidebar settings gear */
.sidebar-gear-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);color:#EAF0F5;font-size:15px;flex-shrink:0;transition:background .15s,transform .2s;}
.sidebar-gear-btn:hover{background:rgba(255,255,255,0.2);transform:rotate(20deg);}

.sync-status-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer;}
.sync-status-pill:hover{background:rgba(255,255,255,0.14);}
.sync-status-pill.offline{background:rgba(178,58,46,0.22);color:#EAF0F5;}
.sync-status-pill.syncing{background:rgba(255,255,255,0.1);color:rgba(234,240,245,0.75);}
.sync-status-pill.syncing svg{animation:sync-spin .8s linear infinite;}
.sync-status-pill.synced{background:transparent;color:rgba(234,240,245,0.55);} /* nothing to report — quiet on purpose, no colored badge needed for "all fine" */
.sync-status-pill.unsynced{background:rgba(199,123,46,0.25);color:#EAF0F5;}
.sync-status-pill{flex-direction:column;align-items:flex-start;gap:4px;} /* stacks the progress bar under the label when a bulk save is in flight */
.sync-status-pill .sync-pill-row{display:flex;align-items:center;gap:6px;}
.sync-progress-track{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,0.18);overflow:hidden;}
.sync-progress-fill{height:100%;background:#7FB88A;border-radius:2px;transition:width .2s ease;}
@keyframes sync-spin{to{transform:rotate(360deg);}}

/* Settings modal */
.settings-account{display:flex;align-items:center;gap:12px;padding:14px;background:var(--paper);border-radius:10px;margin-bottom:16px;}
.settings-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#5C3D80,#2F5C7A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0;letter-spacing:0.5px;}
.settings-account-info{flex:1;min-width:0;}
.settings-account-name{font-weight:600;font-size:14px;color:var(--ink);}
.settings-account-email{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.settings-account-tag{display:inline-block;margin-top:4px;font-size:10px;font-weight:600;color:var(--cover);background:rgba(47,92,122,0.1);padding:2px 8px;border-radius:99px;}
.settings-section{margin-bottom:18px;}
.settings-section h4{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:8px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px;}
.settings-row:last-child{border-bottom:none;}
.settings-toggle{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
.settings-toggle-track{position:absolute;inset:0;background:var(--rule-strong);border-radius:99px;transition:background .15s;}
.settings-toggle.on .settings-toggle-track{background:var(--cover);}
.settings-toggle-thumb{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.3);transition:left .15s;}
.settings-toggle.on .settings-toggle-thumb{left:19px;}
.data-btn-row{display:flex;gap:10px;margin-top:2px;}
.data-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:8px;border:1.5px solid var(--rule-strong);font-weight:600;font-size:13px;color:var(--ink);}
.data-btn:hover{border-color:var(--cover);color:var(--cover);}
.data-btn.primary{background:var(--cover);color:#fff;border-color:var(--cover);}
.data-btn.primary:hover{background:var(--cover-dark);color:#fff;}

/* Undo */
.undo-btn{font-size:11.5px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;}
.undo-btn:hover{color:var(--ink);}

/* Row icon buttons (edit / history / per-question sleep) */
.mcq-row-actions{display:flex;gap:4px;align-items:flex-start;flex-shrink:0;}
.mcq-icon-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;}
.mcq-icon-btn:hover{background:var(--paper);color:var(--ink);}
.mcq-icon-btn.on{color:var(--cover);background:var(--pen-blue-bg);}
.mcq-icon-btn.on svg{fill:currentColor;}
.mcq-row.mcq-asleep{opacity:0.62;}

/* Rich modal (edit / history) */
.modal-card.wide{width:min(640px,100%);max-height:86vh;overflow-y:auto;}
.modal-card.narrow{width:min(300px,100%);max-height:86vh;overflow-y:auto;padding:8px;}
.form-field{margin-bottom:12px;}
.form-field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);margin-bottom:4px;}
.form-field input[type=text],.form-field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--card);color:var(--ink);font-size:13.5px;
}
.form-field textarea{resize:vertical;min-height:60px;}
.option-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.option-edit-row .opt-letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.option-edit-row label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);flex-shrink:0;}

/* Image assignment grid (Edit modal) */
.mcq-image-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.mcq-image-thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--rule-strong);background:var(--paper);}
.mcq-image-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;background:var(--paper);}
.mcq-image-thumb.broken::after{content:'⚠';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pen-red);}
.mcq-image-remove-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:5px;background:rgba(20,20,20,0.65);color:#fff;display:flex;align-items:center;justify-content:center;}
.mcq-image-remove-btn:hover{background:rgba(20,20,20,0.85);}
.mcq-image-add-tile{width:76px;height:76px;border-radius:8px;border:1.5px dashed var(--rule-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);font-size:10px;font-weight:600;}
.mcq-image-add-tile:hover{border-color:var(--cover);color:var(--cover);background:var(--pen-blue-bg);}

/* Question images (practice view) */
.qimage-grid{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;}
/* Bounding frame, not a stretch target: large images get capped relative to the
   viewport height specifically (so they never eat up the whole screen and force
   heavy scrolling, regardless of their native resolution), while small images are
   left at their natural size — only max-* constraints are set here, nothing forces
   a minimum, so nothing ever gets upscaled/blurred to fill the box. Aspect ratio is
   always preserved either way since width/height are never set explicitly together. */
.qimage-thumb{display:inline-flex;align-items:center;justify-content:center;max-width:100%;padding:6px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);}
.qimage-thumb img{display:block;max-width:100%;max-height:clamp(160px,42vh,420px);width:auto;height:auto;border-radius:4px;cursor:zoom-in;}
.qimage-thumb.broken{padding:20px;text-align:center;color:var(--ink-faint);font-size:12px;}
.qimage-thumb.broken img{display:none;}
.qimage-thumb.broken::after{content:'⚠ Image could not load';}

/* Full-size image lightbox */
.image-lightbox{position:fixed;inset:0;background:rgba(10,12,14,0.9);display:flex;align-items:center;justify-content:center;z-index:110;padding:30px;}
.image-lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);cursor:zoom-out;}
.image-lightbox-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,0.15);color:#fff;}
.image-lightbox-close:hover{background:rgba(255,255,255,0.3);color:#fff;}
.history-item{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12.5px;gap:10px;}
.history-item:last-child{border-bottom:none;}
.history-verdict{font-weight:600;padding:2px 8px;border-radius:99px;font-size:10.5px;flex-shrink:0;}
.history-verdict.correct{background:var(--pen-green-bg);color:var(--pen-green);}
.history-verdict.wrong{background:var(--pen-red-bg);color:var(--pen-red);}
.history-timing{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-faint);margin-top:3px;}
.history-remarks{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.remark-pill{font-size:10.5px;color:var(--ink-soft);background:var(--paper);padding:2px 7px;border-radius:99px;}
.fsrs-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.fsrs-stat-grid div{background:var(--paper);border-radius:8px;padding:8px;text-align:center;}
.fsrs-stat-grid .stat-num{font-size:16px;font-weight:700;}
.fsrs-stat-grid .stat-label{font-size:10px;color:var(--ink-soft);margin-top:2px;}

.toc-root-link{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;font-size:13px;font-weight:600;color:rgba(234,240,245,0.85);margin-bottom:2px;}
.toc-root-link:hover{background:rgba(255,255,255,0.1);}
.toc-root-link.active{background:rgba(255,255,255,0.16);color:#EAF0F5;}
.toc{display:flex;flex-direction:column;gap:2px;}
.toc-empty{font-size:12.5px;color:rgba(234,240,245,0.55);line-height:1.5;padding:6px 2px;}
.toc-node{}
.toc-row{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-radius:6px;font-size:13px;
  color:#EAF0F5;
}
.toc-row:hover{background:rgba(255,255,255,0.08);}
.toc-row.selected{background:rgba(255,255,255,0.16);}
.toc-toggle{width:14px;flex-shrink:0;color:rgba(234,240,245,0.6);font-size:10px;display:inline-flex;align-items:center;justify-content:center;}
.toc-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.toc-count{font-size:11px;color:rgba(234,240,245,0.55);flex-shrink:0;}
.toc-node.subject > .toc-row .toc-label{font-weight:600;}
.toc-children{margin-left:14px;border-left:1px solid rgba(255,255,255,0.14);padding-left:4px;}

.side-footer{margin-top:auto;font-size:11px;color:rgba(234,240,245,0.5);line-height:1.6;}

/* ---------- Main ---------- */
.main{padding:30px 40px 60px;max-width:960px;}
.view-head{margin-bottom:22px;}
.view-title{font-size:clamp(20px,5.5vw,26px);font-weight:600;}
.view-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

.breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin-bottom:10px;}
.breadcrumb-link{color:var(--cover);text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:2px;}
.breadcrumb-link:hover{color:var(--cover-dark);}
.breadcrumb-sep{color:var(--ink-faint);}
.breadcrumb-current{color:var(--ink-soft);font-weight:600;}

/* Chapter/subject card grid */
.chapter-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;
  margin-top:6px;
}
.chapter-card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;
  transition:box-shadow .12s,border-color .12s,opacity .12s;
}
.chapter-card:hover{border-color:var(--rule-strong);box-shadow:var(--shadow-card);}
.chapter-card.asleep{opacity:0.62;}
.chapter-card-toolbar{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:2;}
.chapter-card-sleep-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);background:var(--paper);}
.chapter-card-sleep-btn:hover{color:var(--ink);background:var(--rule);}
.chapter-card-sleep-btn.on{color:var(--cover);background:var(--pen-blue-bg);}
.chapter-card-sleep-btn.on svg{fill:currentColor;}
.chapter-card-menu-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);background:var(--paper);}
.chapter-card-menu-btn:hover{color:var(--ink);background:var(--rule);}
.sleep-badge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);background:var(--paper);padding:2px 6px;border-radius:99px;vertical-align:middle;margin-left:4px;}

/* Folder (has nested chapters — clicking drills into another grid) vs leaf
   (clicking opens the question list directly) — quick visual distinction. */
.deck-type-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:8px;}
.deck-type-tag.folder{background:var(--pen-amber-bg);color:var(--pen-amber);}
.deck-type-tag.folder svg{fill:var(--pen-amber);stroke:var(--pen-amber);}
.deck-type-tag.leaf{background:var(--paper);color:var(--ink-soft);font-weight:600;}
/* Folder decks (have nested chapters — clicking drills into another grid) get a real
   manila-folder tint so the distinction reads instantly, not just from a small badge.
   Leaf decks (clicking opens the question list directly) stay plain paper-white. */
.chapter-card.is-folder{background:var(--pen-amber-bg);border-color:var(--pen-amber);border-left:3px solid var(--pen-amber);}
.chapter-card.is-folder .chapter-card-sleep-btn,
.chapter-card.is-folder .chapter-card-menu-btn{background:var(--card);border:1px solid rgba(0,0,0,0.08);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
.chapter-card.is-leaf{border-left:3px solid var(--rule-strong);}

/* Deck (subject/chapter) context menu — modal action-sheet style */
.deck-menu{padding:6px;}
.deck-menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);text-align:left;}
.deck-menu-item:hover{background:var(--paper);}
.deck-menu-item svg{flex-shrink:0;color:var(--ink-soft);}
.deck-menu-divider{height:1px;background:var(--rule);margin:6px 4px;}
.deck-menu-item.danger{color:var(--pen-red);}
.deck-menu-item.danger svg{color:var(--pen-red);}
.deck-menu-item.danger:hover{background:var(--pen-red-bg);}

/* Paste banner — appears wherever you navigate after cutting a deck */
.paste-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pen-blue-bg);border:1px dashed var(--cover);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--ink);}
.paste-banner strong{color:var(--cover);}
.chapter-card-body{padding:clamp(12px,4vw,16px) clamp(14px,4vw,18px) clamp(10px,3vw,14px);flex:1;}
.chapter-card-title{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin-bottom:8px;}
.chapter-card-stats{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.stat-good{color:var(--pen-green);font-weight:600;}
.stat-mid{color:var(--highlighter-ink);font-weight:600;}
.stat-low{color:var(--pen-red);font-weight:600;}
.chapter-card-view{
  display:flex;align-items:center;justify-content:center;gap:5px;width:100%;text-align:center;padding:11px 10px;
  background:rgba(47,92,122,0.08);color:var(--cover);font-weight:600;font-size:13px;
  border-top:1px solid var(--rule);
}
.chapter-card-view:hover{background:rgba(47,92,122,0.16);}

.card{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}

/* Filters — compact single-line toolbar with a collapsible tag panel */
.filters-bar{margin-bottom:18px;}
.filter-toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 2px;border-bottom:1px solid var(--rule);
}
.filter-toolbar-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.filter-divider{width:1px;align-self:stretch;background:var(--rule);margin:2px 2px;}
.filter-clear-link{
  font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;
  margin-left:auto;
}
.filter-clear-link:hover{color:var(--ink);}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--rule-strong);
  font-size:12px;background:var(--card);color:var(--ink-soft);
}
.chip.active{background:var(--ink);color:var(--card);border-color:var(--ink);}
.chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.chip-x{opacity:0.65;font-size:11px;margin-left:1px;}
.tags-trigger{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--rule-strong);
  font-size:12px;background:var(--card);color:var(--ink-soft);
}
.tags-trigger.has-active{border-color:var(--cover);color:var(--cover);}
.tags-trigger .caret{font-size:9px;opacity:0.7;}
.tags-trigger .count-badge{
  background:var(--cover);color:#fff;border-radius:999px;
  font-size:10px;line-height:1;padding:2px 6px;
}
select.status-select{
  border:1px solid var(--rule-strong);border-radius:999px;padding:5px 22px 5px 10px;font-size:12px;background:var(--card);color:var(--ink-soft);
}
select.status-select-unanswered{border-color:var(--cover);color:var(--cover);background:var(--pen-blue-bg);}
select.status-select-correct{border-color:var(--pen-green);color:var(--pen-green);background:var(--pen-green-bg);}
select.status-select-wrong{border-color:var(--pen-red);color:var(--pen-red);background:var(--pen-red-bg);}
select.status-select-flagged{border-color:#D6A900;color:#8A6A00;background:#FFF4BF;}
.tag-panel{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:12px 2px 4px;
  border-bottom:1px solid var(--rule);
  margin-bottom:2px;
}
.tag-panel-empty{font-size:12.5px;color:var(--ink-faint);padding:6px 0;}

/* MCQ list */
.mcq-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.mcq-row{
  padding:12px 14px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;
  box-shadow:none;border-color:var(--rule);
}
.mcq-row:hover{border-color:var(--rule-strong);box-shadow:var(--shadow-card);}
.mcq-status-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--rule-strong);}
.mcq-status-dot.correct{background:var(--pen-green);}
.mcq-status-dot.wrong{background:var(--pen-red);}
.mcq-status-dot.flagged{background:var(--highlighter);}
.mcq-row-text{flex:1;font-size:13.5px;line-height:1.5;}
.mcq-row-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center;}
.tag-pill{
  font-size:10.5px;padding:2px 8px;border-radius:999px;
  background:var(--rule);color:var(--ink-soft);
}
.tag-pill-more{font-size:10.5px;color:var(--ink-faint);}
.source-pill{font-size:10.5px;padding:2px 8px;border-radius:999px;color:#fff;}

.action-row{display:flex;gap:16px;margin:16px 0 4px;flex-wrap:wrap;align-items:center;}
.link-btn{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;}
.lucide-icon{flex-shrink:0;vertical-align:middle;}
.icon-inline{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;}
.link-btn:hover{color:var(--ink);}
.btn{
  padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;
  border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--ink);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--cover);color:#fff;border-color:var(--cover);}
.btn-primary:hover{background:var(--cover-dark);border-color:var(--cover-dark);}
.btn-danger{color:var(--pen-red);border-color:var(--pen-red);}
.btn-danger:hover{background:var(--pen-red-bg);}
.btn-ghost{border-color:transparent;}
.btn-ghost:hover{background:var(--rule);}
.btn-sm{padding:6px 11px;font-size:12px;}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .serif{font-size:18px;color:var(--ink);margin-bottom:6px;display:block;}

/* Add source view */
.section-block{padding:clamp(14px,4vw,18px) clamp(14px,4vw,20px);margin-bottom:18px;}
.section-block h3{font-size:14.5px;font-weight:600;margin-bottom:10px;}
.prompt-box{
  background:#1B242C;color:#DCE6D9;border-radius:8px;padding:14px 16px;
  font-size:11.8px;line-height:1.65;max-height:260px;overflow-y:auto;white-space:pre-wrap;
}
textarea.ingest-area{
  width:100%;min-height:220px;border:1px solid var(--rule-strong);border-radius:8px;
  padding:12px 14px;font-size:13px;line-height:1.6;font-family:'IBM Plex Mono',monospace;
  background:var(--card);color:var(--ink);resize:vertical;
}
.field-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.field{flex:1;min-width:180px;}
.field label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
.field input{width:100%;border:1px solid var(--rule-strong);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--card);color:var(--ink);}
.parse-report{margin-top:12px;font-size:13px;}
.parse-ok{color:var(--pen-green);font-weight:600;}
.parse-err-list{margin-top:8px;font-size:12px;color:var(--pen-red);line-height:1.6;}
.source-manage-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.source-manage-row:last-child{border-bottom:none;}

/* Practice view */
.practice-wrap{max-width:720px;}
.practice-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.progress-track{flex:1;height:6px;background:var(--rule);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--cover);border-radius:99px;transition:width .25s;}
.progress-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}

.answer-sheet{padding:clamp(16px,5vw,26px) clamp(16px,5vw,30px) clamp(20px,5vw,30px);}
.qmeta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.qnum{font-size:12px;color:var(--ink-soft);}
.qmeta-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;}
.passage-box{
  background:var(--paper);border-left:3px solid var(--cover);padding:12px 14px;
  border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.65;margin-bottom:16px;color:var(--ink-soft);
}
.qtext{font-size:clamp(15px,4vw,17px);line-height:1.6;margin-bottom:20px;}
.qtext p{margin-bottom:8px;}
.mcq-table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px;}
.mcq-table th,.mcq-table td{border:1px solid var(--rule-strong);padding:6px 10px;text-align:left;}
.mcq-table th{background:var(--paper);}
.img-placeholder{
  background:var(--paper);border:1px dashed var(--rule-strong);border-radius:6px;
  padding:14px;font-size:12.5px;color:var(--ink-soft);margin:10px 0;
}

.multi-select-hint{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--cover);background:var(--pen-blue-bg);padding:6px 10px;border-radius:7px;margin-bottom:10px;}

/* Reviewing an already-answered question (viewIndex < index) */
.reviewing-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--cover);background:var(--pen-blue-bg);padding:8px 12px;border-radius:8px;margin-bottom:12px;}
.reviewing-banner .link-btn{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-weight:600;}

/* Question overview (birds-eye) grid */
.q-ov-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
.q-ov-legend-item{display:inline-flex;align-items:center;gap:5px;}
.q-ov-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.q-ov-dot.correct{background:var(--pen-green);}
.q-ov-dot.wrong{background:var(--pen-red);}
.q-ov-dot.upcoming{background:var(--rule-strong);}
.q-ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;}
.q-ov-cell{position:relative;height:44px;border-radius:8px;border:1.5px solid var(--rule-strong);background:var(--card);color:var(--ink-soft);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
.q-ov-cell:hover:not(:disabled){border-color:var(--cover);}
.q-ov-cell.correct{background:var(--pen-green-bg);border-color:var(--pen-green);color:var(--pen-green);}
.q-ov-cell.wrong{background:var(--pen-red-bg);border-color:var(--pen-red);color:var(--pen-red);}
.q-ov-cell.current{box-shadow:0 0 0 2px var(--cover);border-color:var(--cover);}
.q-ov-cell.locked{opacity:0.4;cursor:not-allowed;}
.q-ov-bookmark{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--highlighter);color:#5B4A0E;display:flex;align-items:center;justify-content:center;}
.bubbles{display:flex;flex-direction:column;gap:10px;}
.bubble{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  padding:11px 14px;border:1px solid var(--rule-strong);border-radius:9px;background:var(--card);
  transition:border-color .15s,background .15s;
}
.bubble:hover:not(.locked){border-color:var(--ink);}
.bubble:active:not(.locked):not(:disabled){transform:scale(0.985);}
.bubble.selected{background:var(--paper);border-color:var(--ink);}
.bubble-mark{position:relative;width:30px;height:30px;flex-shrink:0;}
.bubble-letter{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-faint);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  transition:background .15s,color .15s,border-color .15s;
}
.bubble.selected .bubble-letter{background:var(--ink);color:var(--card);border-color:var(--ink);}
.bubble.reveal-correct .bubble-letter{background:var(--pen-green);color:#fff;border-color:var(--pen-green);}
.bubble.reveal-wrong.selected .bubble-letter{background:var(--pen-red);color:#fff;border-color:var(--pen-red);}
.bubble-text{font-size:14.5px;line-height:1.5;flex:1;}
.bubble.locked{cursor:default;}

.short-answer-box textarea{width:100%;min-height:70px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--ink);}

.reveal-panel{margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule-strong);}
.reveal-verdict{font-size:14px;font-weight:600;margin-bottom:8px;}
.reveal-verdict.correct{color:var(--pen-green);}
.reveal-verdict.wrong{color:var(--pen-red);}
.reveal-verdict.pending{color:var(--cover);}
.reveal-explain{font-size:13.5px;line-height:1.65;color:var(--ink-soft);}
.reveal-explain p{margin-bottom:6px;}

/* Notes — deliberately visually distinct from the answer key itself: tinted like a
   sticky note, so there's never any confusion between "what the source says" and
   "what I wrote myself". */
.notes-section{margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule-strong);}
.notes-header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
.notes-header .link-btn{font-size:12.5px;font-weight:600;}
.note-entry{background:var(--pen-yellow-bg);border:1px solid #D6A900;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.note-entry:last-child{margin-bottom:0;}
.note-entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.note-entry-date{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.note-entry-text{font-size:13px;line-height:1.55;color:var(--ink);}

.learning-banner{padding:18px;border-radius:12px;margin-bottom:18px;font-size:15px;line-height:1.6;color:var(--ink);}
.learning-banner.new{background:var(--pen-green-bg);border-left:5px solid var(--pen-green);}
.learning-banner.noconcept{background:var(--pen-yellow-bg);border-left:5px solid var(--highlighter);}
.learning-banner.misconception{background:var(--pen-red-bg);border-left:5px solid var(--pen-red);}
.learning-banner.learning{background:var(--pen-blue-bg);border-left:5px solid var(--pen-blue);}
.learning-banner.mastered{background:var(--pen-green-bg);border-left:5px solid var(--pen-green);}

.answer-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
.bookmark-btn{display:inline-flex;align-items:center;gap:7px;}
.bookmark-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;}
.bookmark-btn.bookmarked{color:#8A6A00;background:#FFF4BF;border-color:#D6A900;}
.bookmark-btn.bookmarked svg{fill:#F0C33C;stroke:#8A6A00;}
.paused-card{padding:16px 18px;margin-bottom:18px;border-left:4px solid var(--highlighter);}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,34,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-card{width:min(520px,100%);background:var(--card);border:1px solid var(--rule-strong);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.22);padding:clamp(16px,5vw,22px);}
.modal-card h3{font-family:'Fraunces',Georgia,serif;font-size:20px;margin-bottom:8px;}
.modal-close-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;}
.modal-close-btn:hover{background:var(--paper);color:var(--ink);}
.modal-card p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:18px;}

/* Summary */
.summary-card{padding:clamp(18px,6vw,34px);text-align:center;}
.score-ring{
  width:clamp(105px,32vw,140px);height:clamp(105px,32vw,140px);border-radius:50%;border:6px solid var(--pen-red);
  display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 20px;
}
.score-ring.good{border-color:var(--pen-green);}
.score-big{font-size:clamp(25px,7vw,34px);font-weight:700;}
.score-sub{font-size:12px;color:var(--ink-soft);}
.summary-breakdown{text-align:left;margin-top:22px;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px;}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--overlay-bg);color:var(--overlay-ink);padding:10px 18px;border-radius:8px;font-size:13px;
  opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:var(--ink-soft);}

/* Auth gate */
.auth-gate{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--paper);background-image:linear-gradient(var(--rule) 1px, transparent 1px);background-size:100% 32px;padding:20px;}
.auth-card{width:min(360px,100%);background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow-card);padding:32px 28px;text-align:center;}
.auth-title{font-size:24px;font-weight:600;margin-bottom:4px;}
.auth-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;line-height:1.5;}
.google-signin-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px;}
.google-signin-btn:hover{background:var(--paper);border-color:var(--ink-faint);}
.auth-config-warning{text-align:left;font-size:12.5px;line-height:1.6;color:var(--pen-red);background:var(--pen-red-bg);border-radius:8px;padding:12px 14px;}
.auth-config-warning code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:4px;}
.auth-error{font-size:12.5px;color:var(--pen-red);margin-top:10px;}

.sidebar-backdrop{display:none;}
@media (max-width:860px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:80vw;max-width:300px;z-index:40;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(10,14,18,0.55);z-index:35;animation:backdropFadeIn .15s ease;}
  .main{padding:16px 16px 50px;}
  .mobile-topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .chapter-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .action-row{gap:10px;}
  /* iOS Safari auto-zooms the page when a focused text field's font-size is under
     16px — force every field to 16px on mobile so tapping into search/edit/filter
     inputs doesn't yank the viewport in. */
  input, textarea, select { font-size:16px !important; }
}
@media (max-width:520px){
  .chapter-grid{grid-template-columns:1fr;}
  .fsrs-stat-grid{gap:6px;}
  .modal-card.wide{max-height:90vh;}
  .field-row{gap:10px;}
  .action-row{flex-direction:column;align-items:stretch;gap:8px;}
  .action-row .btn{width:100%;justify-content:center;}
  .summary-breakdown{margin-top:16px;}
  .mcq-row-meta{gap:5px;}
  /* Tighten the header chrome above search/browse results so more of the
     actual list is visible without scrolling on a phone. */
  .main-search{margin-bottom:10px;}
  .view-head{margin-bottom:12px;}
  .view-title{margin-bottom:2px;}
  .breadcrumb{margin-bottom:6px;}
  .filters-bar{margin-bottom:10px;}
  .filter-toolbar{gap:6px;}

var SUPABASE_ANON_KEY = _cfg.SUPABASE_ANON_KEY || '';
var SUPABASE_CONFIGURED = !!SUPABASE_URL && !!SUPABASE_ANON_KEY;

/* ===================================================== */


var state = {
  mcqs: [],
  sources: {},
  view: 'browse',
  selectedPath: null,
  filters: { sources: {}, tags: {}, status: 'all', tagPanelOpen: false, search: '' },
  forceList: false,
  session: null,
  sidebarOpen: false,
  expanded: {},
  learningMode: { enabled: true },
  darkMode: false,
  streak: { count: 0, lastDate: null },
  pausedSession: null,
  pendingStart: null,
  activeModal: null,
  fsrsCardExpanded: true,
  sleepingSubjects: {},
  pendingNav: null,
  clipboardNode: null,
  pendingDeckDelete: null,
  currentUser: null,
  imageUrlMap: {}, /* hash -> ImgBB URL, the only image-related thing that ever reaches Supabase (plain text) */
  editingMcqId: null,
  autoSleepEnabled: true,
  autoSleepStreak: 4,
  zipImportJob: null, /* {active, processed, total, attached, notFound, skippedNames} — survives navigating away mid-import */
  hasUnsyncedChanges: false, /* true whenever a save to Supabase has failed and hasn't been confirmed since — drives the retry loop and the sync status pill */
  lastSaveHadPermanentConflict: false, /* true right after a save fails specifically due to an ownership conflict (RLS) — a permanent failure, not something the retry loop should keep hammering */
  pendingImportPayload: null, /* a parsed JSON import file, waiting on the user to choose keep-progress vs start-fresh before it actually gets applied */
  pendingNoteDraft: null, /* {mcqId, images} while the Add Note modal is open, before it's actually saved onto the question */
  deletedMcqIds: {} /* id -> deletedAt ms — tombstones for questions removed on THIS or any other device, so a stale local mirror on a device that hasn't opened in a while doesn't resurrect something that was deliberately deleted elsewhere. Trimmed periodically — see trimDeletedMcqIds(). */
};

/* ================= Local-first data mirror =================
   Supabase stays the source of truth for cross-device sync, but every save
   writes here FIRST, synchronously, unconditionally — before any network
   attempt. This is what makes offline use actually work (there's something
   to read/write to with zero signal) and makes a failed cloud save
   non-destructive (the edit still exists locally, and gets retried later —
   see retryUnsyncedChangesIfAny). Scoped per-user so switching accounts on
   the same browser can't leak one person's cached library into another's. */
/* The full mirror lives in IndexedDB, not localStorage — a full library (thousands of
   questions, each with history/notes/timing data) can realistically approach or
   exceed localStorage's typical 5-10MB per-origin quota, while IndexedDB's quota is
   an order of magnitude larger (commonly 50MB+, often a share of free disk space).
   IndexedDB writes are async though, which is fine for this — it's read on normal
   app load and written after every save, both of which have plenty of time to
   complete. The one case that genuinely needs a write to survive even if the tab
   closes mid-write — the auto-pause-on-close listeners in init() — uses a SEPARATE,
   tiny, genuinely-synchronous localStorage entry instead (see
   persistPausedSessionSync below), holding just one paused test's worth of data
   rather than the whole library, so it stays trivially within quota regardless of
   how large the library grows. */
var DATA_MIRROR_DB_NAME = 'practex_data_mirror_v1';
var DATA_MIRROR_STORE_NAME = 'mirror';
var dataMirrorDbPromise = null;
function openDataMirrorDb(){
  if (dataMirrorDbPromise) return dataMirrorDbPromise;
  dataMirrorDbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open(DATA_MIRROR_DB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if (!db.objectStoreNames.contains(DATA_MIRROR_STORE_NAME)) db.createObjectStore(DATA_MIRROR_STORE_NAME, { keyPath: 'key' });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('Could not open local data mirror')); };
  });
  return dataMirrorDbPromise;
}
async function persistLocalMirror(){
  if (!state.currentUser) return;
  try {
    var payload = {
      key: 'current',
      version: 1,
      updatedAt: Date.now(),
      userId: state.currentUser.id,
      mcqs: state.mcqs,
      sources: state.sources,
      streak: state.streak,
      sleepingSubjects: state.sleepingSubjects,
      fsrsModeEnabled: state.learningMode.enabled,
      darkMode: state.darkMode,
      fsrsCardExpanded: state.fsrsCardExpanded,
      autoSleepEnabled: state.autoSleepEnabled,
      autoSleepStreak: state.autoSleepStreak,
      pausedSession: state.pausedSession,
      deletedMcqIds: state.deletedMcqIds
    };
    var db = await openDataMirrorDb();
    var tx = db.transaction(DATA_MIRROR_STORE_NAME, 'readwrite');
    await requestToPromise(tx.objectStore(DATA_MIRROR_STORE_NAME).put(payload));
  } catch(err) { console.warn('Local mirror save failed:', err); }
}
async function loadLocalMirror(){
  if (!state.currentUser) return null;
  try {
    var db = await openDataMirrorDb();
    var tx = db.transaction(DATA_MIRROR_STORE_NAME, 'readonly');
    var payload = await requestToPromise(tx.objectStore(DATA_MIRROR_STORE_NAME).get('current'));
    if (!payload || payload.userId !== state.currentUser.id) return null; // not this account's cache — don't leak it in
    return payload;
  } catch(err) { return null; }
}
/* The tiny, genuinely-synchronous companion to the above — see the big comment up
   top for why this exists separately. Holds just one paused session, never the
   library, so it's always trivially small regardless of how big the library gets. */
var PAUSED_SESSION_SYNC_KEY = 'practex_paused_session_sync_v1';
function persistPausedSessionSync(){
  if (!state.currentUser) return;
  try {
    localStorage.setItem(PAUSED_SESSION_SYNC_KEY, JSON.stringify({ userId: state.currentUser.id, pausedSession: state.pausedSession }));
  } catch(err) { console.warn('Paused-session quick-save failed:', err); }
}
function loadPausedSessionSync(){
  try {
    var raw = localStorage.getItem(PAUSED_SESSION_SYNC_KEY);
    if (!raw) return null;
    var payload = JSON.parse(raw);
    if (!state.currentUser || payload.userId !== state.currentUser.id) return null;
    return payload.pausedSession || null;
  } catch(err) { return null; }
}

var PALETTE = ['#2F5C7A','#B23A2E','#2F6E45','#8B5E9C','#C77B2E','#3D7D8C','#9C4F6E','#5C6B2F'];

function colorForSource(name){
  if (state.sources[name] && state.sources[name].color) return state.sources[name].color;
  var keys = Object.keys(state.sources);
  var idx = keys.indexOf(name);
  if (idx < 0) idx = keys.length;
  return PALETTE[idx % PALETTE.length];
}

function uid(){ return 'm_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ================= Image storage (ImgBB via a server relay, never Supabase) =================
   Same architecture as Kardex's image pipeline: compress client-side, cache locally in
   IndexedDB (instant redraws, works offline), and mirror to ImgBB through a server-side
   relay so any signed-in device can pull the same image down later via a plain URL.
   Only that {hash: url} map is ever synced to Supabase — as plain text in the
   mcq_image_urls table — never raw image bytes. The actual ImgBB call happens in
   /api/upload-image.js (a Vercel serverless function, not in this file) so the ImgBB
   API key stays a server-side secret instead of sitting in this page's source. See
   SUPABASE_SETUP.md for how to deploy that function and set IMGBB_API_KEY. */
var IMAGE_DB_NAME = 'practex_images_v1';
var IMAGE_STORE_NAME = 'images';
var IMAGE_MAX_DIM = 1600;   // longest edge, in px, after resize
var IMAGE_QUALITY = 0.82;   // WebP/JPEG quality, 0-1
var imageDbPromise = null;

function requestToPromise(request){
  return new Promise(function(resolve, reject){
    request.onsuccess = function(){ resolve(request.result); };
    request.onerror = function(){ reject(request.error || new Error('IndexedDB request failed')); };
  });
}
function openImageDb(){
  if (imageDbPromise) return imageDbPromise;
  imageDbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open(IMAGE_DB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if (!db.objectStoreNames.contains(IMAGE_STORE_NAME)) db.createObjectStore(IMAGE_STORE_NAME, { keyPath: 'hash' });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('Could not open image store')); };
  });
  return imageDbPromise;
}
function readFileAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error('Could not read image')); };
    reader.readAsDataURL(file);
  });
}
async function computeSha256(buffer){
  var hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hashBuffer)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
/* Resizes + re-encodes before anything is ever stored, so bandwidth and storage stay
   cheap without the person having to think about it. Falls back to the original file
   untouched if compression fails or doesn't actually help. */
async function compressImageForUpload(file){
  var originalMime = file.type || 'image/png';
  try {
    if (!('createImageBitmap' in window)) return { blob: file, mimeType: originalMime };
    if (originalMime === 'image/gif') return { blob: file, mimeType: originalMime }; // don't destroy animation
    var bitmap = await createImageBitmap(file);
    var width = bitmap.width, height = bitmap.height;
    var scale = Math.min(1, IMAGE_MAX_DIM / Math.max(width, height));
    width = Math.max(1, Math.round(width * scale));
    height = Math.max(1, Math.round(height * scale));
    var canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, width, height);
    if (bitmap.close) bitmap.close();
    var targetMime = 'image/webp';
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, targetMime, IMAGE_QUALITY); });
    if (!blob) return { blob: file, mimeType: originalMime };
    if (scale < 1 || blob.size < file.size) return { blob: blob, mimeType: targetMime };
    return { blob: file, mimeType: originalMime }; // compression didn't help — keep original
  } catch(err) {
    console.warn('Image compression skipped, using original', err);
    return { blob: file, mimeType: originalMime };
  }
}
var imageCloudSyncWarnedOnce = false;
function warnImageCloudSyncFailed(err){
  if (imageCloudSyncWarnedOnce) return;
  imageCloudSyncWarnedOnce = true;
  console.warn('Image cloud sync failed — images are still saved locally on this device. ' +
    '(Check that IMGBB_API_KEY is set on your hosting provider and /api/upload-image is deployed.)', err);
}
/* Fire-and-forget: uploads a locally-cached image to ImgBB so other devices can find
   it, then records the resulting URL. Safe to call repeatedly — a hash that already
   has a URL is a no-op rather than a duplicate upload. */
async function uploadImageToCloud(hash, mimeType, blob){
  if (!state.currentUser) return; // not signed in — local-only, nothing to sync to
  if (state.imageUrlMap[hash]) return;
  try {
    var dataUrl = await readFileAsDataUrl(blob);
    var base64 = (dataUrl.split(',')[1]) || '';
    if (!base64) throw new Error('Could not read image data for upload');
    var res = await fetch('/api/upload-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64 })
    });
    var data = await res.json().catch(function(){ return null; });
    if (res.ok && data && data.url) {
      state.imageUrlMap[hash] = data.url;
      saveImageUrl(hash, data.url);
    } else {
      warnImageCloudSyncFailed(data && data.error ? data.error : ('HTTP ' + res.status));
    }
  } catch(err) {
    warnImageCloudSyncFailed(err);
  }
}
async function saveImageUrl(hash, url){
  if (!state.currentUser || !supabaseClient) return;
  try {
    var res = await supabaseClient.from('mcq_image_urls').upsert({ hash: hash, user_id: state.currentUser.id, url: url });
    if (res.error) throw res.error;
  } catch(err) { console.error('saveImageUrl:', err); }
}
async function loadImageUrlMap(){
  state.imageUrlMap = {};
  if (!state.currentUser || !supabaseClient) return;
  try {
    var res = await supabaseClient.from('mcq_image_urls').select('hash,url').eq('user_id', state.currentUser.id);
    if (res.error) throw res.error;
    (res.data || []).forEach(function(row){ state.imageUrlMap[row.hash] = row.url; });
  } catch(err) { console.error('loadImageUrlMap:', err); }
}
async function downloadImageFromCloud(hash){
  var url = state.imageUrlMap[hash];
  if (!url) return null;
  try {
    var res = await fetch(url);
    if (!res.ok) return null;
    var blob = await res.blob();
    return { blob: blob, mimeType: blob.type || undefined };
  } catch(err) { return null; }
}
async function storeImageFromFile(file){
  var compressed = await compressImageForUpload(file);
  var blob = compressed.blob, mimeType = compressed.mimeType;
  var dataUrl = await readFileAsDataUrl(blob);
  var buffer = await blob.arrayBuffer();
  var hash = await computeSha256(buffer);
  var db = await openImageDb();
  var tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
  var store = tx.objectStore(IMAGE_STORE_NAME);
  var existing = await requestToPromise(store.get(hash));
  if (!existing) await requestToPromise(store.put({ hash: hash, mimeType: mimeType, dataUrl: dataUrl }));
  uploadImageToCloud(hash, mimeType, blob); // background — don't block the UI on network
  return hash;
}
async function getImageRecord(hash){
  if (!hash) return null;
  var db = await openImageDb();
  var tx = db.transaction(IMAGE_STORE_NAME, 'readonly');
  return requestToPromise(tx.objectStore(IMAGE_STORE_NAME).get(hash));
}
/* Returns a displayable data URL for a hash — local cache first (instant), falling
   back to the ImgBB URL (and re-caching locally) for images synced in from another
   device that this browser hasn't seen yet. */
async function resolveImageRef(hash){
  if (!hash) return null;
  var record = await getImageRecord(hash);
  if (record) return record.dataUrl;
  var cloud = await downloadImageFromCloud(hash);
  if (!cloud) return null;
  var dataUrl = await readFileAsDataUrl(cloud.blob);
  try {
    var db = await openImageDb();
    var tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
    await requestToPromise(tx.objectStore(IMAGE_STORE_NAME).put({ hash: hash, mimeType: cloud.mimeType || 'application/octet-stream', dataUrl: dataUrl }));
  } catch(err) {}
  return dataUrl;
}

/* ---------------- Storage (Supabase, scoped to the signed-in user) ---------------- */
// PostgREST (Supabase's REST layer) silently caps any unbounded .select() at
// a default max-rows-per-request (commonly 1000) — it does NOT error when a
// query would return more; it just returns that many rows with a normal
// success response. For a library over that size, the plain single-call
// select below was ALWAYS missing the tail end of the library, every single
// load — which loadLibrary()'s reconciliation then (correctly, given what it
// could see) treated as "unsynced, recover and re-push it", pushed it again,
// and the next load truncated the exact same way. That's what was showing up
// as an endless resync loop recovering the same few thousand questions over
// and over: they were never actually missing from the cloud, just never
// being fully fetched. This pages through with .range() until a page comes
// back shorter than a full page, so the full library is always what
// reconciliation is actually comparing against.
var MCQ_FETCH_PAGE_SIZE = 1000;
async function fetchAllMcqRows(){
  var all = [];
  var from = 0;
  while (true) {
    var res = await supabaseClient.from('mcqs').select('data').eq('user_id', state.currentUser.id).range(from, from + MCQ_FETCH_PAGE_SIZE - 1);
    if (res.error) throw res.error;
    var page = res.data || [];
    all = all.concat(page);
    if (page.length < MCQ_FETCH_PAGE_SIZE) break; // shorter than a full page — this was the last one
    from += MCQ_FETCH_PAGE_SIZE;
  }
  return all;
}

async function loadLibrary(){
  if (!state.currentUser || !supabaseClient) { state.mcqs = []; state.sources = {}; return; }
  var usedMirrorFallback = false;

  // Settings (including deletedMcqIds, the tombstone list) load FIRST, before
  // mcqs — the mcqs reconciliation below needs to know about deletions from
  // any device before it decides whether a locally-cached question that's
  // missing from the cloud is "unsynced, recover it" or "deleted elsewhere,
  // leave it gone".
  try {
    var setRes = await supabaseClient.from('user_settings').select('*').eq('user_id', state.currentUser.id).maybeSingle();
    if (setRes.error) throw setRes.error;
    var row = setRes.data;
    state.sources = (row && row.sources) || {};
    state.pausedSession = (row && row.paused_session) || null;
    state.deletedMcqIds = (row && row.deleted_mcq_ids) || {};
    /* Reconcile against BOTH local pause sources — the tiny synchronous localStorage
       entry (guaranteed to have survived an actual tab close) and the full IndexedDB
       mirror's own pausedSession (kept current on every normal save). Whichever of
       the three — cloud, sync entry, mirror — has the newest pausedAt wins, and if a
       local one wins, it gets pushed up to Supabase now that we're back online and
       have time to actually save it properly. */
    var mirrorForPause = await loadLocalMirror();
    var syncPaused = loadPausedSessionSync();
    var cloudPausedAt = state.pausedSession ? (state.pausedSession.pausedAt || 0) : 0;
    var mirrorPausedAt = mirrorForPause && mirrorForPause.pausedSession ? (mirrorForPause.pausedSession.pausedAt || 0) : 0;
    var syncPausedAt = syncPaused ? (syncPaused.pausedAt || 0) : 0;
    var bestPausedAt = Math.max(cloudPausedAt, mirrorPausedAt, syncPausedAt);
    if (bestPausedAt > cloudPausedAt) {
      state.pausedSession = (syncPausedAt === bestPausedAt) ? syncPaused : mirrorForPause.pausedSession;
      saveUserSettings(); /* best-effort push-up, not awaited — loadLibrary() shouldn't block on this */
    }
    // Same idea as pausedSession above, but for tombstones: a delete recorded
    // locally (e.g. offline, or the settings save itself hadn't landed yet)
    // that the cloud doesn't have yet should still be respected THIS session,
    // not just re-added to state.deletedMcqIds after the fact — merge it in
    // now, before it's used below.
    if (mirrorForPause && mirrorForPause.deletedMcqIds) {
      var mergedTombstones = false;
      Object.keys(mirrorForPause.deletedMcqIds).forEach(function(id){
        if (!state.deletedMcqIds[id] || mirrorForPause.deletedMcqIds[id] > state.deletedMcqIds[id]) {
          state.deletedMcqIds[id] = mirrorForPause.deletedMcqIds[id];
          mergedTombstones = true;
        }
      });
      if (mergedTombstones) saveUserSettings(); /* push the merged tombstone list back up, best-effort */
    }
    trimDeletedMcqIds();
    state.learningMode.enabled = row ? (row.fsrs_mode_enabled !== false) : false; /* brand-new accounts start in plain practice mode — FSRS is opt-in, not the default */
    state.darkMode = !!(row && row.dark_mode);
    state.streak = (row && row.streak) || { count: 0, lastDate: null };
    state.fsrsCardExpanded = row ? (row.fsrs_card_expanded !== false) : true;
    state.sleepingSubjects = (row && row.sleeping_subjects) || {};
    state.autoSleepEnabled = row ? (row.auto_sleep_enabled !== false) : true;
    state.autoSleepStreak = (row && row.auto_sleep_streak) || 4;
  } catch(e) {
    console.error('loadLibrary (settings):', e);
    var mirror2 = await loadLocalMirror();
    if (mirror2) {
      state.sources = mirror2.sources || {};
      state.pausedSession = mirror2.pausedSession || null;
      state.deletedMcqIds = mirror2.deletedMcqIds || {};
      state.learningMode.enabled = mirror2.fsrsModeEnabled !== false;
      state.darkMode = !!mirror2.darkMode;
      state.streak = mirror2.streak || { count: 0, lastDate: null };
      state.fsrsCardExpanded = mirror2.fsrsCardExpanded !== false;
      state.sleepingSubjects = mirror2.sleepingSubjects || {};
      state.autoSleepEnabled = mirror2.autoSleepEnabled !== false;
      state.autoSleepStreak = mirror2.autoSleepStreak || 4;
      usedMirrorFallback = true;
    } else {
      state.deletedMcqIds = {};
    }
  }

  try {
    var cloudMcqs = (await fetchAllMcqRows()).map(function(row){ return row.data; });
    /* Reconcile against the local mirror instead of trusting a SUCCESSFUL pull
       blindly. A save that never actually finished reaching the server — tab closed
       mid-write, a network blip that got flagged but hadn't been retried yet, the OS
       killing the app before an in-flight request completed — doesn't throw an error
       here; the query just comes back successful with an incomplete answer. Silently
       overwriting state.mcqs with that incomplete copy is exactly what discarded a
       freshly-imported deck that was still sitting safely in the local IndexedDB
       mirror the whole time. Anything the mirror has that the cloud pull doesn't is
       treated as not-yet-synced and recovered — UNLESS it's in the tombstone list
       loaded above, in which case it was deliberately deleted (maybe on another
       device) and a stale local copy shouldn't bring it back. */
    var mirrorForReconcile = await loadLocalMirror();
    var cloudIds = {};
    cloudMcqs.forEach(function(m){ if (m && m.id) cloudIds[m.id] = true; });
    var localOnly = (mirrorForReconcile && Array.isArray(mirrorForReconcile.mcqs))
      ? mirrorForReconcile.mcqs.filter(function(m){ return m && m.id && !cloudIds[m.id] && !state.deletedMcqIds[m.id]; })
      : [];
    state.mcqs = cloudMcqs.concat(localOnly);
    // Seed the dirty-tracking snapshot cache (see saveLibrary()) with
    // exactly what the cloud just confirmed it has — anything in cloudMcqs
    // is known-synced right now, so it's excluded from the next save unless
    // it actually changes. localOnly is deliberately left UNSEEDED: those
    // rows still need pushing, and leaving them out of the cache is what
    // correctly marks them dirty for the very next saveLibrary() call.
    lastSyncedMcqSnapshots = {};
    cloudMcqs.forEach(function(m){ if (m && m.id) lastSyncedMcqSnapshots[m.id] = JSON.stringify(m); });
    if (localOnly.length) {
      state.hasUnsyncedChanges = true; // these never reached the server last time — get them pushed up now
      showToast(localOnly.length + ' question' + (localOnly.length===1?'':'s') + ' from last time hadn\'t finished syncing — recovered from your local copy and re-saving now.');
      retryUnsyncedChangesIfAny(); // don't just flag it and wait for the next focus/online event — push it up right away
    }
  } catch(e) {
    console.error('loadLibrary (mcqs):', e);
    var mirror = await loadLocalMirror();
    if (mirror && Array.isArray(mirror.mcqs)) {
      state.mcqs = mirror.mcqs;
      usedMirrorFallback = true;
      // Deliberately NOT seeding lastSyncedMcqSnapshots here — this is the
      // offline/error fallback, so there's no confirmation any of this
      // actually matches the cloud. Leaving the cache empty means the next
      // successful saveLibrary() treats everything as dirty and does one
      // full resync to re-establish a known-good baseline, which is exactly
      // the safe/correct behavior when we're not sure what the server has.
    } else {
      state.mcqs = [];
      showToast('Could not load your library — no local copy available either.');
    }
  }

  await loadImageUrlMap();
  if (usedMirrorFallback) {
    state.hasUnsyncedChanges = true; // whatever's cached locally hasn't been confirmed against the server this session
    showToast('Loaded from your local copy — looks like you\'re offline. Changes will sync once you\'re back.');
  }
}
/* All the small per-user preferences live in one row so toggling any of them is a

async function saveUserSettings(){
  persistLocalMirror(); /* local-first, unconditional, before any network attempt */

  if (!state.currentUser || !supabaseClient) return;

     is what actually caused FSRS mode (and other settings) to "revert" on an
     abrupt tab switch. A toggle calls this fire-and-forget; if a background
     fullSync() (tab focus/visibility) fired while THIS request was still in
     flight, it had no way to know a save was pending — hasUnsyncedChanges was
     still false — so it skipped straight to pulling, sometimes winning the
     race against this upsert and overwriting state.learningMode.enabled (or
     whatever else was mid-save) with the stale pre-toggle value from the
     server. Setting this up front means any concurrent fullSync() correctly
     pushes first instead of pulling over an in-flight write. */
  state.hasUnsyncedChanges = true;
  updateSyncIndicator();

    var res = await supabaseClient.from('user_settings').upsert({
      user_id: state.currentUser.id,
      sources: state.sources,
      paused_session: state.pausedSession,
      fsrs_mode_enabled: state.learningMode.enabled,
      dark_mode: state.darkMode,
      streak: state.streak,
      fsrs_card_expanded: state.fsrsCardExpanded,
      sleeping_subjects: state.sleepingSubjects,
      auto_sleep_enabled: state.autoSleepEnabled,
      auto_sleep_streak: state.autoSleepStreak,
      deleted_mcq_ids: state.deletedMcqIds,
      updated_at: new Date().toISOString()
    });
    if (res.error) throw res.error;
    state.hasUnsyncedChanges = false;
    updateSyncIndicator();
  } catch(e) {
    console.error('saveUserSettings:', e);
    state.hasUnsyncedChanges = true;
    updateSyncIndicator();
  }
}

/* ================= Sync resilience: retry + multi-trigger + visible status =================

   (state.hasUnsyncedChanges) and gets retried the next time any of several
   real-world "you might be back" moments happen: refocusing the tab,
   switching back to it, the browser's own online event firing, being

   those fire for some reason — a 30-second safety-net timer regardless. */

async function fullSync(opts){

  if (syncInFlight) return;

  try {
    // Push first if this device already has a pending local edit — otherwise
    // the pull below would fetch a stale (pre-edit) cloud copy of that same
    // row and silently overwrite the not-yet-saved change. Mirrors Kardex's
    // doSync() ordering logic exactly.
    if (state.hasUnsyncedChanges){
      await saveLibrary();
      await saveUserSettings();

    // The actual fix for "coming back to the tab doesn't see what changed
    // elsewhere" — this pulls fresh cloud state and reconciles it against
    // the local mirror (recovering anything still-unsynced, respecting
    // deletion tombstones — see loadLibrary()). Previously autoSync() only
    // ever pushed pending changes and never pulled at all, so a change made
    // on another device/tab was invisible here until a full page reload.
    await loadLibrary();
    // Don't re-render over an active practice session (mid-question state
    // isn't something a background pull should disturb) or over unsaved
    // text sitting in the Add Source paste box (a full render rebuilds that
    // view from scratch, which would silently wipe out whatever's typed/
    // pasted there and hasn't been parsed yet).
    var hasUnparsedDraft = state.view === 'addsource' && document.getElementById('ingestArea') && document.getElementById('ingestArea').value.trim();
    if (!isMidSession() && !hasUnparsedDraft) render();

      showToast(state.hasUnsyncedChanges ? 'Synced from the cloud (local changes will retry automatically)' : 'Synced.');
    }
  } catch(e) {
    console.error('fullSync:', e);
    if (!opts.silent) showToast('Could not sync — check your connection and try again.');
  } finally {
    syncInFlight = false;
    updateSyncIndicator();
  }

async function retryUnsyncedChangesIfAny(){
  if (!state.hasUnsyncedChanges || !state.currentUser || !supabaseClient || syncInFlight) return;
  syncInFlight = true;

    updateSyncIndicator();
  }

function autoSync(){
  if (!state.currentUser) return;
  if (isMidSession()) return; // don't yank a live practice session's data out from under it mid-question
  var now = Date.now();
  if (now - lastAutoSyncAt < AUTO_SYNC_MIN_INTERVAL_MS) return;
  lastAutoSyncAt = now;
  fullSync({ silent: true });
}

/* Re-renders just the small status pill in the sidebar rather than the whole
   app — cheap, and safe to call from anywhere including mid-network-request. */
function updateSyncIndicator(){
  var el = document.getElementById('syncStatusPill');

  el.outerHTML = renderSyncStatusPill();
}
/* Always visible when signed in — not hidden-by-default. A status indicator that

  if (!state.currentUser) return '<div id="syncStatusPill"></div>';
  var offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  var cls, label, iconName;
  if (syncInFlight) { cls = 'syncing'; label = currentSyncProgress ? ('Syncing ' + currentSyncProgress.done + ' of ' + currentSyncProgress.total + '…') : 'Syncing…'; iconName = 'refresh-cw'; }
  else if (offline) { cls = 'offline'; label = 'Offline — saved locally'; iconName = 'wifi-off'; }
  else if (state.hasUnsyncedChanges) { cls = 'unsynced'; label = 'Unsynced — tap to retry'; iconName = 'refresh-cw'; }

async function manualSync(){

    return;

/* Upserts the current in-memory library in one batched request (Postgres upsert

   Note: this does NOT delete rows that were removed locally — see deleteMcqRows(). */
// Bulk saves send only what actually CHANGED since the last confirmed sync,
// not the whole library — the earlier batching fix made resending everything
// more reliable, but it was still resending everything, every single save,
// even to update one question's answer history. That's the real gap versus
// Kardex's per-record pushes. Manually marking every mutation site "dirty"
// was ruled out here — with 30+ scattered places that touch a question
// (answering, editing, flagging, notes, images, sleep state...), missing
// even one would silently stop that data from ever syncing, which is worse

// id -> JSON string), and a save simply compares current vs. last-known —
// anything different (or new) gets pushed, anything unchanged doesn't. This

// question changed, only THAT it did.
var lastSyncedMcqSnapshots = {}; // id -> JSON.stringify(question) as of the last confirmed successful sync

async function saveLibrary(){
  persistLocalMirror(); /* local-first, unconditional, before any network attempt */

  if (!state.currentUser || !supabaseClient) return;
  if (!state.mcqs.length) return;

  var dirty = [];
  state.mcqs.forEach(function(m){
    if (!m || !m.id) return;
    var serialized = JSON.stringify(m);
    if (lastSyncedMcqSnapshots[m.id] !== serialized) dirty.push({ id: m.id, serialized: serialized });
  });
  if (!dirty.length) {
    // Everything already matches what the server confirmed last time —
    // genuinely nothing to push. Distinct from "nothing to do because the
    // library is empty" above; this is the common case for a routine
    // autoSync that finds no real changes.
    state.hasUnsyncedChanges = false;
    updateSyncIndicator();
    return;
  }

  // Flagged as unsynced BEFORE the network attempt — same reasoning as
  // saveUserSettings() above: an answer/rating/edit that's still genuinely
  // in flight needs a concurrent fullSync() (tab focus/visibility) to know
  // to push it first rather than pull over it. See that function's comment
  // for the full race-condition explanation.
  state.hasUnsyncedChanges = true;

    var mcqById = {};
    state.mcqs.forEach(function(m){ if (m && m.id) mcqById[m.id] = m; });
    var total = dirty.length;
    if (total > LIBRARY_SAVE_BATCH_SIZE) currentSyncProgress = { done: 0, total: total };
    for (var i = 0; i < total; i += LIBRARY_SAVE_BATCH_SIZE){
      var chunk = dirty.slice(i, i + LIBRARY_SAVE_BATCH_SIZE);
      var rows = chunk.map(function(d){
        return { id: d.id, user_id: state.currentUser.id, data: mcqById[d.id], updated_at: new Date().toISOString() };
      });
      var res = await supabaseClient.from('mcqs').upsert(rows);
      if (res.error) throw res.error;
      // Only this chunk's rows are confirmed synced now — updating their
      // snapshots (not all of `dirty`) means a failure on a LATER chunk
      // correctly leaves only the not-yet-sent rows marked dirty for retry,
      // rather than incorrectly re-marking already-confirmed ones too.
      chunk.forEach(function(d){ lastSyncedMcqSnapshots[d.id] = d.serialized; });
      if (currentSyncProgress){

         already exist in the table under a DIFFERENT account (e.g. a JSON export from
         one sign-in imported while signed into another). This is a permanent conflict,
         not a network hiccup — retrying it automatically forever would just repeat the
         same failure, so this deliberately does NOT set hasUnsyncedChanges (which
         would otherwise queue it for the retry loop). Say so plainly instead of a
         generic "could not save", and flag it so callers (e.g. the import flow) don't
         also show a misleading "success" message right after this one. */
      state.lastSaveHadPermanentConflict = true;
      showToast('Some questions couldn\'t sync — they already exist under a different Practex account. Sign in as whichever account originally created them.');
      updateSyncIndicator();
      return;
    }

    updateSyncIndicator();
  }
}

    (m.answerImages || []).forEach(function(h){ stillUsed[h] = true; });
  });
  var orphaned = candidateHashes.filter(function(h, i){ return h && !stillUsed[h] && candidateHashes.indexOf(h) === i; });
  if (!orphaned.length) return;
  try {
    var db = await openImageDb();
    var tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
    var store = tx.objectStore(IMAGE_STORE_NAME);
    orphaned.forEach(function(h){ store.delete(h); });
  } catch(err) { console.error('purgeOrphanedImageHashes (local):', err); }
  orphaned.forEach(function(h){ delete state.imageUrlMap[h]; });
  if (state.currentUser && supabaseClient) {
    try {
      var res = await supabaseClient.from('mcq_image_urls').delete().eq('user_id', state.currentUser.id).in('hash', orphaned);
      if (res.error) throw res.error;
    } catch(err) { console.error('purgeOrphanedImageHashes (cloud):', err); }
  }
}
function exportLibrary(){

/* Reused by both the Settings "export everything" button and the Library browser's
   "Export this view" action — the export itself doesn't need to know or care whether
   it's the whole library or something scoped by folder/filters, it just needs the
   final list of questions to write out. Sources are trimmed to only the ones actually
   represented in this subset, so a scoped export doesn't drag in irrelevant source
   metadata for content that isn't included. */
function exportMcqSubset(mcqs, filenameLabel){
  if (!mcqs.length) { showToast('Nothing to export.'); return; }
  var relevantSources = {};
  mcqs.forEach(function(m){ if (state.sources[m.source]) relevantSources[m.source] = state.sources[m.source]; });
  var payload = {

    mcqs: mcqs,

/* Re-schedules the whole library using the current FSRS ceiling rules, for
   questions whose due date was computed before a scheduling-logic fix
   shipped. Doesn't touch history, ratings, or FSRS stability/difficulty —

function recomputeAllDueDates(){
